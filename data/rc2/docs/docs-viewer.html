<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RC2 Docs Viewer</title>
  <style>
    :root {
      --bg: #f5f9ff;
      --card: #ffffff;
      --text: #1f3b53;
      --muted: #5a738a;
      --border: #c8d9e9;
      --link: #1c6aa3;
    }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #ecf4fc 0%, var(--bg) 100%);
      color: var(--text);
    }
    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 1rem;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.8rem;
    }
    .toolbar a {
      color: var(--link);
      text-decoration: none;
      font-weight: 600;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.35rem 0.7rem;
      background: #fff;
    }
    .toolbar a:hover { background: #f1f7ff; }
    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .doc {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 8px 22px rgba(16, 43, 70, 0.06);
    }
    #doc-title {
      margin: 0 0 0.3rem;
      font-size: 1.3rem;
    }
    #doc-content h1,
    #doc-content h2,
    #doc-content h3 { color: #12324c; }
    #doc-content code {
      font-family: Consolas, "Courier New", monospace;
      background: #edf4fb;
      padding: 0.1rem 0.28rem;
      border-radius: 5px;
      font-size: 0.92em;
    }
    #doc-content pre {
      background: #0e2235;
      color: #e8f2fb;
      border-radius: 10px;
      padding: 0.8rem;
      overflow-x: auto;
    }
    #doc-content pre code {
      background: transparent;
      color: inherit;
      padding: 0;
    }
    #doc-content a { color: var(--link); }
    #doc-content table {
      border-collapse: collapse;
      width: 100%;
      overflow-x: auto;
      display: block;
    }
    #doc-content th,
    #doc-content td {
      border: 1px solid #d3e2f0;
      padding: 0.45rem;
      text-align: left;
    }
    .error {
      border: 1px solid #efc391;
      background: #fff6ec;
      color: #8c4905;
      border-radius: 10px;
      padding: 0.7rem;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <main class="wrap">
    <div class="toolbar">
      <a href="/data/rc2/rc2-index.html">Back To RC2 Portal</a>
      <a href="?id=wiki">Wiki</a>
      <a href="?id=saving">Saving Missions</a>
      <a href="?id=onboarding">Onboarding</a>
    </div>
    <p id="doc-path" class="subtitle"></p>
    <section class="doc">
      <h1 id="doc-title">Documentation</h1>
      <div id="doc-content"></div>
    </section>
  </main>
  <script>
    (function () {
      const map = {
        wiki: {
          title: 'MAM RC2 PS1 Wiki',
          path: '/data/rc2/docs/MAM_RC2_PS1_Wiki.md'
        },
        saving: {
          title: 'Saving Missions to RC2',
          path: '/data/rc2/docs/Saving_Missions_to_RC2.md'
        },
        onboarding: {
          title: 'RC2 UUID Mission Integration - New User Onboarding',
          path: '/data/rc2/docs/RC2_UUID_Mission_Integration_New_User_Onboarding.md'
        }
      };

      const params = new URLSearchParams(window.location.search);
      const id = (params.get('id') || 'wiki').toLowerCase();
      const selected = map[id] || map.wiki;

      const titleEl = document.getElementById('doc-title');
      const pathEl = document.getElementById('doc-path');
      const contentEl = document.getElementById('doc-content');

      titleEl.textContent = selected.title;
      pathEl.textContent = selected.path;

      fetch(selected.path)
        .then((res) => {
          if (!res.ok) {
            throw new Error(`HTTP ${res.status}`);
          }
          return res.text();
        })
        .then((md) => {
          if (window.marked && typeof window.marked.parse === 'function') {
            contentEl.innerHTML = window.marked.parse(md);
            return;
          }
          contentEl.innerHTML = `<pre>${md.replace(/[<>&]/g, (ch) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[ch]))}</pre>`;
        })
        .catch((err) => {
          contentEl.innerHTML = `<div class="error">Failed to load documentation: ${String(err && err.message ? err.message : err)}.</div>`;
        });
    })();
  </script>
</body>
</html>
