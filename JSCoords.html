<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Coordinate Converter</title>
<style>
  body { font-family: Arial, sans-serif; max-width:720px; margin:24px; }
  label { display:block; margin-top:12px; font-weight:600; }
  textarea,input { width:100%; box-sizing:border-box; padding:8px; font-size:14px; }
  pre { background:#f6f6f6; padding:8px; overflow:auto; }
  .row { display:flex; gap:8px; margin-top:8px; }
  .col { flex:1; }
  button { padding:8px 12px; }
  .ok { color:green; font-weight:700; }
  .err { color:crimson; font-weight:700; }
</style>
</head>
<body>
<h2>Coordinate Converter</h2>
<label>Input (any common formats: DD, DMS, DM, NOTAM compact like 4414N07938W, "lat lon", "lon,lat")</label>
<textarea id="input" rows="3" placeholder="e.g., 44.233333, -79.633333  OR  4414N07938W001  OR  44°14'0\"N 79°38'0\"W"></textarea>
<div class="row">
  <div class="col"><button id="convert">Convert</button></div>
  <div class="col"><button id="clear">Clear</button></div>
</div>

<label>Detected / Parsed</label>
<pre id="parsed">(no parse yet)</pre>

<label>Outputs</label>
<pre id="map">Map (lat, lon):</pre>
<pre id="kml">KML (lon,lat):</pre>
<pre id="notam">NOTAM compact DM:</pre>

<script>
/* Minimal CoordUtils (same parsing/formatting logic) */
const CoordUtils = (() => {
  function parseSingle(token) {
    if (!token) return null;
    token = String(token).trim();
    const cardMatch = token.match(/([NSWE])$/i);
    const card = cardMatch ? cardMatch[1].toUpperCase() : null;
    let core = card ? token.slice(0, -1) : token;
    core = core.replace(/[°º∘]/g, ' ')
               .replace(/[’‘′`]/g, "'")
               .replace(/[“”″"]/g, '"')
               .replace(/[^\d.+-]/g, ' ')
               .trim();
    const parts = core.split(/\s+/).filter(Boolean);

    if (parts.length === 1 && /^[-+]?(\d+(\.\d*)?|\.\d+)$/.test(parts[0])) {
      let v = Number(parts[0]);
      if (card) { if (card==='S'||card==='W') v = -Math.abs(v); else v = Math.abs(v); }
      return v;
    }

    if (parts.length === 1 && /^\d+$/.test(parts[0])) {
      const s = parts[0];
      if (s.length === 4 || s.length === 6) {
        const deg = Number(s.slice(0, s.length === 4 ? 2 : 2));
        const min = Number(s.slice(s.length === 4 ? 2 : 4, s.length === 4 ? 4 : 6)) || 0;
        const sec = s.length === 6 ? Number(s.slice(4,6)) : 0;
        let dd = deg + (min/60) + (sec/3600);
        if (card === 'S') dd = -dd;
        return dd;
      }
      if (s.length === 5 || s.length === 7) {
        const deg = Number(s.slice(0, 3));
        const min = Number(s.slice(s.length === 5 ? 3 : 5, s.length === 5 ? 5 : 7)) || 0;
        const sec = s.length === 7 ? Number(s.slice(5,7)) : 0;
        let dd = deg + (min/60) + (sec/3600);
        if (card === 'W') dd = -dd;
        return dd;
      }
    }

    if (parts.length >= 2) {
      const deg = Number(parts[0]);
      const min = Number(parts[1]) || 0;
      const sec = Number(parts[2]) || 0;
      let sign = 1;
      if (card) { if (card==='S'||card==='W') sign = -1; }
      else if (String(parts[0]).startsWith('-')) sign = -1;
      const dd = Math.abs(deg) + (min/60) + (sec/3600);
      return sign * dd;
    }
    return null;
  }

  function parseCoordinateString(input) {
    if (!input) return null;
    input = String(input).trim();
    const notamPair = input.match(/^(\d{4,6}[NS])\s*(\d{5,7}[EW])(?:\d{3})?$/i);
    if (notamPair) {
      const lat = parseSingle(notamPair[1]);
      const lon = parseSingle(notamPair[2]);
      return lat!==null && lon!==null ? {lat, lon} : null;
    }

    let parts = input.split(',');
    if (parts.length === 2) {
      const a = parseSingle(parts[0].trim()), b = parseSingle(parts[1].trim());
      if (a!==null && b!==null) {
        if (Math.abs(a) <= 90 && Math.abs(b) <= 180) return {lat:a, lon:b};
        if (Math.abs(b) <= 90 && Math.abs(a) <= 180) return {lat:b, lon:a};
      }
    }

    const tokens = input.split(/\s+/).filter(Boolean);
    const nsToken = tokens.find(t => /[NS]$/i.test(t));
    const ewToken = tokens.find(t => /[EW]$/i.test(t));
    if (nsToken && ewToken) {
      const lat = parseSingle(nsToken), lon = parseSingle(ewToken);
      return lat!==null && lon!==null ? {lat, lon} : null;
    }

    if (tokens.length === 2) {
      const a = parseSingle(tokens[0]), b = parseSingle(tokens[1]);
      if (a!==null && b!==null) {
        if (Math.abs(a) <= 90 && Math.abs(b) <= 180) return {lat:a, lon:b};
        if (Math.abs(b) <= 90 && Math.abs(a) <= 180) return {lat:b, lon:a};
      }
    }

    const coordRegex = /(-?\d+(?:\.\d+)?)[ ,]+(-?\d+(?:\.\d+)?)/;
    const m = input.match(coordRegex);
    if (m) return { lat: Number(m[1]), lon: Number(m[2]) };

    return null;
  }

  function toMapString(lat,lon,dec=6){ return `${lat.toFixed(dec)}, ${lon.toFixed(dec)}`; }
  function toKmlString(lat,lon,dec=6){ return `${lon.toFixed(dec)},${lat.toFixed(dec)}`; }
  function toNotamCompact(lat,lon){
    const latSign = lat<0?'S':'N', lonSign = lon<0?'W':'E';
    const a = Math.abs(lat), b = Math.abs(lon);
    let latDeg = Math.floor(a), latMin = Math.round((a - latDeg) * 60);
    let lonDeg = Math.floor(b), lonMin = Math.round((b - lonDeg) * 60);
    if (latMin===60){ latDeg +=1; latMin=0; }
    if (lonMin===60){ lonDeg +=1; lonMin=0; }
    const latStr = String(latDeg).padStart(2,'0') + String(latMin).padStart(2,'0') + latSign;
    const lonStr = String(lonDeg).padStart(3,'0') + String(lonMin).padStart(2,'0') + lonSign;
    return latStr + lonStr;
  }

  return { parseCoordinateString, toMapString, toKmlString, toNotamCompact };
})();

/* UI wiring */
const inp = document.getElementById('input');
const outParsed = document.getElementById('parsed');
const outMap = document.getElementById('map');
const outKml = document.getElementById('kml');
const outNotam = document.getElementById('notam');
const btn = document.getElementById('convert');
const clearBtn = document.getElementById('clear');

function showResult(res, src){
  if (!res) {
    outParsed.textContent = 'Parse failed — input not recognized';
    outMap.textContent = 'Map (lat, lon):';
    outKml.textContent = 'KML (lon,lat):';
    outNotam.textContent = 'NOTAM compact DM:';
    return;
  }
  outParsed.textContent = JSON.stringify(res, null, 2);
  outMap.textContent = 'Map (lat, lon): ' + CoordUtils.toMapString(res.lat, res.lon, 6);
  outKml.textContent = 'KML (lon,lat): ' + CoordUtils.toKmlString(res.lat, res.lon, 6);
  outNotam.textContent = 'NOTAM compact DM: ' + CoordUtils.toNotamCompact(res.lat, res.lon);
}

btn.addEventListener('click', () => {
  const v = inp.value.trim();
  const r = CoordUtils.parseCoordinateString(v);
  showResult(r, v);
});

clearBtn.addEventListener('click', () => {
  inp.value = '';
  outParsed.textContent = '(no parse yet)';
  outMap.textContent = 'Map (lat, lon):';
  outKml.textContent = 'KML (lon,lat):';
  outNotam.textContent = 'NOTAM compact DM:';
});

/* quick demo on load */
inp.value = '4414N07938W001';
btn.click();
</script>
</body>
</html>
