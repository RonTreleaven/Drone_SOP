<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drone Routes — Google Maps</title>
  <style>
    html,body,#map { height:100%; margin:0; padding:0; }
    #controls { position:absolute; top:8px; left:8px; z-index:5; background:#fff; padding:8px; border-radius:4px; box-shadow:0 1px 4px rgba(0,0,0,.3); }
    #file{display:block;margin:6px 0}
    #addressSearch{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;margin-top:6px}
    #addressQuery{width:220px}
    #manualCoords{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center;margin-top:6px}
    #manualCoords input{width:130px}
    #status{margin-top:6px;font-size:12px;color:#333}
  </style>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBFKbcvjFqzHOfvOxRuGn7jP2JJt4CTmhg&libraries=drawing,geometry"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tmcw/togeojson@7.1.2/dist/togeojson.umd.min.js"></script>
</head>
<body>
  <div id="controls">
    <button id="drawPolyline">Draw Route</button>
    <button id="exportGeoJSON">Export GeoJSON</button>
    <button id="exportKML">Export KML</button>
    <button id="toggleRouteEdit">Lock Route</button>
    <button id="locateMe">Locate Me</button>
    <label for="file">Import GPX/KML</label>
    <input id="file" type="file" accept=".gpx,.kml" />
    <button id="play">Play</button>
    <button id="pause">Pause</button>
    <label>Speed: <input id="speed" type="range" min="1" max="10" value="3"></label>
    <div id="addressSearch">
      <input id="addressQuery" type="text" placeholder="Search address, city, or lat,lng" aria-label="Search address or coordinates" />
      <button id="searchAddress">Search</button>
    </div>
    <div id="manualCoords">
      <input id="pilotLat" type="number" step="0.000001" placeholder="Lat (decimal)" aria-label="Pilot latitude" />
      <input id="pilotLng" type="number" step="0.000001" placeholder="Lng (decimal)" aria-label="Pilot longitude" />
      <button id="updatePilotPos">Update</button>
    </div>
    <div id="status"></div>
  </div>
  <div id="map"></div>

<script>
let map, geocoder, drawingManager, activePolyline=null, droneMarker=null, userMarker=null, animationId=null;
let routePath = []; // array of {lat,lng,alt?}
let playIndex=0, lastTs=null;
let routeEditEnabled = true;
let waypointMarkers = [];
const iconDrone = {
  path: "M0 -12 L6 6 L0 3 L-6 6 Z",
  scale: 1.8,
  fillColor: "#ff5722",
  fillOpacity: 1,
  strokeWeight: 0,
  anchor: new google.maps.Point(0,0)
};
const pilotIcon = {
  url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
      <path d="M32 4 C45 4 56 15 56 28 C56 44 40 55 32 60 C24 55 8 44 8 28 C8 15 19 4 32 4 Z" fill="#0b5cab"/>
      <circle cx="32" cy="27" r="15" fill="#ffffff"/>
      <path d="M22 24 H42 L39 20 H25 Z" fill="#16324f"/>
      <rect x="29" y="20" width="6" height="2.5" rx="1" fill="#f1b431"/>
      <path d="M18 33 L10 36 L18 39 Z" fill="#16324f"/>
      <path d="M46 33 L54 36 L46 39 Z" fill="#16324f"/>
      <circle cx="32" cy="31" r="7" fill="#2f3c4f"/>
      <circle cx="29.5" cy="30" r="1" fill="#ffffff"/>
      <circle cx="34.5" cy="30" r="1" fill="#ffffff"/>
      <rect x="30.5" y="33" width="3" height="1.4" rx="0.7" fill="#ffffff"/>
    </svg>
  `),
  scaledSize: new google.maps.Size(42, 42),
  anchor: new google.maps.Point(21, 42)
};

function initMap(){
  map = new google.maps.Map(document.getElementById('map'), {
    center: {lat:37.7749,lng:-122.4194},
    zoom: 13,
    mapTypeId: 'satellite'  
  });
  geocoder = new google.maps.Geocoder();

  drawingManager = new google.maps.drawing.DrawingManager({
    drawingMode: null,
    drawingControl: false,
    polylineOptions: {
      clickable: true,
      editable: true,
      draggable: true,
      strokeColor: '#2196F3',
      strokeWeight: 3
    }
  });
  drawingManager.setMap(map);

  google.maps.event.addListener(drawingManager, 'polylinecomplete', (poly)=>{
    drawingManager.setDrawingMode(null);
    setActivePolyline(poly);
    extractPathFromPolyline(poly);
    setStatus('Route created. Drag numbered waypoints to reshape, then lock when done.');
  });

  document.getElementById('drawPolyline').onclick = ()=> drawingManager.setDrawingMode(google.maps.drawing.OverlayType.POLYLINE);
  document.getElementById('exportGeoJSON').onclick = exportGeoJSON;
  document.getElementById('exportKML').onclick = exportKML;
  document.getElementById('toggleRouteEdit').onclick = toggleRouteEdit;
  document.getElementById('file').addEventListener('change', handleFile, false);
  document.getElementById('play').onclick = startPlayback;
  document.getElementById('pause').onclick = pausePlayback;
  document.getElementById('locateMe').onclick = focusOnUserLocation;
  document.getElementById('searchAddress').onclick = searchAddressOrLatLng;
  document.getElementById('addressQuery').addEventListener('keydown', (e) => { if(e.key === 'Enter') searchAddressOrLatLng(); });
  document.getElementById('updatePilotPos').onclick = updatePilotPositionFromInput;
  document.getElementById('pilotLat').addEventListener('keydown', (e) => { if(e.key === 'Enter') updatePilotPositionFromInput(); });
  document.getElementById('pilotLng').addEventListener('keydown', (e) => { if(e.key === 'Enter') updatePilotPositionFromInput(); });

  // Request location on explicit user click to avoid browser auto-block quirks.
  setStatus('Click Locate Me to use GPS, or search/address/lat,lng to set pilot location.');
}

function setStatus(msg){
  const el = document.getElementById('status');
  if(el) el.textContent = msg || '';
}

function ensurePilotMarker(userPos){
  if(!userMarker){
    userMarker = new google.maps.Marker({
      position: userPos,
      map,
      title: 'Pilot location',
      icon: pilotIcon,
      draggable: true
    });

    google.maps.event.addListener(userMarker, 'drag', () => {
      const p = userMarker.getPosition();
      if(!p) return;
      syncPilotInputs(p.lat(), p.lng());
      setStatus(`Pilot marker: Lat ${p.lat().toFixed(6)}, Lng ${p.lng().toFixed(6)} (dragging)`);
    });

    google.maps.event.addListener(userMarker, 'dragend', () => {
      const p = userMarker.getPosition();
      if(!p) return;
      syncPilotInputs(p.lat(), p.lng());
      setStatus(`Pilot marker set: Lat ${p.lat().toFixed(6)}, Lng ${p.lng().toFixed(6)}`);
    });
  } else {
    userMarker.setPosition(userPos);
    userMarker.setDraggable(true);
  }
}

function setPilotPosition(userPos, statusMessage){
  ensurePilotMarker(userPos);
  map.setCenter(userPos);
  if(map.getZoom() < 16) map.setZoom(16);
  syncPilotInputs(userPos.lat, userPos.lng);
  setStatus(statusMessage || `Pilot marker set: Lat ${userPos.lat.toFixed(6)}, Lng ${userPos.lng.toFixed(6)}`);
}

function searchAddressOrLatLng(){
  const query = document.getElementById('addressQuery').value.trim();
  if(!query){
    setStatus('Enter an address/city or lat,lng pair to search.');
    return;
  }

  const pair = query.match(/^\s*(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)\s*$/);
  if(pair){
    const lat = Number(pair[1]);
    const lng = Number(pair[2]);
    if(lat < -90 || lat > 90 || lng < -180 || lng > 180){
      setStatus('Latitude must be -90..90 and longitude must be -180..180.');
      return;
    }
    setPilotPosition({ lat, lng }, `Pilot marker set from coordinates: Lat ${lat.toFixed(6)}, Lng ${lng.toFixed(6)}`);
    return;
  }

  if(!geocoder){
    setStatus('Geocoder is not ready yet. Try again.');
    return;
  }

  setStatus('Searching address...');
  geocoder.geocode({ address: query }, (results, status) => {
    if(status === 'OK' && results && results[0]){
      const loc = results[0].geometry.location;
      const userPos = { lat: loc.lat(), lng: loc.lng() };
      setPilotPosition(userPos, `Pilot marker set from address: ${results[0].formatted_address}`);
      document.getElementById('addressQuery').value = results[0].formatted_address;
      return;
    }

    if(status === 'ZERO_RESULTS') setStatus('No matching address found. Try adding city/province.');
    else if(status === 'OVER_QUERY_LIMIT') setStatus('Geocoder query limit reached. Please wait and retry.');
    else setStatus(`Address search failed: ${status}`);
  });
}

function syncPilotInputs(lat, lng){
  const latEl = document.getElementById('pilotLat');
  const lngEl = document.getElementById('pilotLng');
  if(latEl) latEl.value = Number(lat).toFixed(6);
  if(lngEl) lngEl.value = Number(lng).toFixed(6);
}

function updatePilotPositionFromInput(){
  const lat = Number(document.getElementById('pilotLat').value);
  const lng = Number(document.getElementById('pilotLng').value);

  if(Number.isNaN(lat) || Number.isNaN(lng)){
    setStatus('Enter valid decimal numbers for latitude and longitude.');
    return;
  }
  if(lat < -90 || lat > 90 || lng < -180 || lng > 180){
    setStatus('Latitude must be -90..90 and longitude must be -180..180.');
    return;
  }

  setPilotPosition({ lat, lng }, `Pilot marker set: Lat ${lat.toFixed(6)}, Lng ${lng.toFixed(6)}`);
}

function focusOnUserLocation(){
  if(!navigator.geolocation){
    setStatus('Geolocation is not supported by this browser.');
    return;
  }

  if(!window.isSecureContext){
    setStatus('Location requires secure context. Use https:// or http://localhost.');
    return;
  }

  const host = window.location.hostname || '';
  const onLocalhost = host === 'localhost' || host === '127.0.0.1';
  if(window.location.protocol === 'http:' && !onLocalhost){
    setStatus('Location is blocked on non-localhost HTTP. Use http://localhost or HTTPS.');
    return;
  }

  setStatus('Getting current location...');

  const requestCurrentPosition = () => {
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        setPilotPosition(userPos, `Pilot marker: Lat ${userPos.lat.toFixed(6)}, Lng ${userPos.lng.toFixed(6)} (drag to fine tune)`);
      },
      (err) => {
        if(err.code === err.PERMISSION_DENIED){
          setStatus('Location denied. Browser or OS is blocking access. Reset Site Settings > Location and ensure Windows Location Services are ON.');
        }
        else if(err.code === err.POSITION_UNAVAILABLE) setStatus('Location unavailable. Check GPS/Wi-Fi location services.');
        else if(err.code === err.TIMEOUT) setStatus('Location request timed out. Try again, or disable high-accuracy mode in OS settings.');
        else setStatus(`Could not get location (code ${err.code}).`);
      },
      {
        enableHighAccuracy: true,
        timeout: 12000,
        maximumAge: 30000
      }
    );
  };

  if(navigator.permissions && navigator.permissions.query){
    navigator.permissions.query({ name: 'geolocation' }).then((p) => {
      if(p.state === 'denied'){
        setStatus('Location permission is currently denied by browser settings. Reset site permission and retry Locate Me.');
        return;
      }
      requestCurrentPosition();
    }).catch(() => {
      requestCurrentPosition();
    });
    return;
  }

  requestCurrentPosition();
}

function setActivePolyline(poly){
  if(activePolyline) activePolyline.setMap(null);
  clearWaypointMarkers();
  activePolyline = poly;
  activePolyline.setEditable(routeEditEnabled);
  activePolyline.setDraggable(routeEditEnabled);
  google.maps.event.addListener(poly.getPath(), 'set_at', ()=> extractPathFromPolyline(poly));
  google.maps.event.addListener(poly.getPath(), 'insert_at', ()=> extractPathFromPolyline(poly));
  google.maps.event.addListener(poly.getPath(), 'remove_at', ()=> extractPathFromPolyline(poly));
  google.maps.event.addListener(poly, 'dragend', ()=> extractPathFromPolyline(poly));
}

function toggleRouteEdit(){
  routeEditEnabled = !routeEditEnabled;
  const btn = document.getElementById('toggleRouteEdit');
  if(btn) btn.textContent = routeEditEnabled ? 'Lock Route' : 'Unlock Route';

  if(activePolyline){
    activePolyline.setEditable(routeEditEnabled);
    activePolyline.setDraggable(routeEditEnabled);
  }
  waypointMarkers.forEach((m)=> m.setDraggable(routeEditEnabled));

  setStatus(routeEditEnabled ? 'Route editing enabled: drag route/vertices to tweak boundaries.' : 'Route locked: editing disabled.');
}

function extractPathFromPolyline(poly){
  const latlngs = poly.getPath().getArray();
  routePath = latlngs.map(ll => ({lat: ll.lat(), lng: ll.lng()}));
  rebuildWaypointMarkers(poly);
  placeAltitudeMarkers(); // if alt present in routePath
  resetPlayback();
}

function clearWaypointMarkers(){
  waypointMarkers.forEach((m)=> m.setMap(null));
  waypointMarkers = [];
}

function rebuildWaypointMarkers(poly){
  clearWaypointMarkers();
  const path = poly.getPath();
  const points = path.getArray();
  points.forEach((pt, idx) => {
    const marker = new google.maps.Marker({
      position: pt,
      map,
      draggable: routeEditEnabled,
      title: `Waypoint ${idx + 1}`,
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: 5,
        fillColor: '#ffffff',
        fillOpacity: 1,
        strokeColor: '#1a73e8',
        strokeWeight: 2
      },
      label: {
        text: String(idx + 1),
        color: '#16324f',
        fontSize: '10px',
        fontWeight: '700'
      }
    });

    marker.addListener('dragend', () => {
      const p = marker.getPosition();
      if(!p || !routeEditEnabled) return;
      path.setAt(idx, p);
      setStatus(`Waypoint ${idx + 1} moved: Lat ${p.lat().toFixed(6)}, Lng ${p.lng().toFixed(6)}`);
    });

    waypointMarkers.push(marker);
  });
}

function placeAltitudeMarkers(){
  // Clear old altitude markers (naive)
  // (For brevity, not storing markers array — in production store and clear.)
  // If you have altitude data, create small labels or markers at points.
}

function handleFile(e){
  const file = e.target.files[0];
  if(!file) return;
  if(!window.toGeoJSON) { alert('toGeoJSON library not loaded. Refresh the page and try again.'); return; }
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const text = ev.target.result;
    let xml;
    try {
      xml = (new DOMParser()).parseFromString(text, 'text/xml');
    } catch(err){ alert('Failed to parse file: ' + err.message); return; }
    // togeojson expects a DOM Document
    let gj = null;
    try {
      if(file.name.toLowerCase().endsWith('.gpx')) gj = window.toGeoJSON.gpx(xml);
      else if(file.name.toLowerCase().endsWith('.kml')) gj = window.toGeoJSON.kml(xml);
    } catch(err) { alert('Failed to convert file: ' + err.message); return; }
    if(!gj) { alert('Unsupported or empty GPX/KML'); return; }
    importGeoJSON(gj);
  };
  reader.readAsText(file);
}

function importGeoJSON(gj){
  // Find first LineString (route) or MultiLineString
  let coords = null;
  if(gj.features && gj.features.length){
    for(const f of gj.features){
      const geom = f.geometry;
      if(!geom) continue;
      if(geom.type === 'LineString'){
        coords = geom.coordinates; break;
      } else if(geom.type === 'MultiLineString'){
        coords = geom.coordinates[0]; break;
      } else if(geom.type === 'Point' && !coords){
        coords = [geom.coordinates];
      }
    }
  }
  if(!coords){ alert('No route found in file'); return; }
  // coords are [lng,lat,(alt)]
  const path = coords.map(c=>{
    const obj = {lat: c[1], lng: c[0]}; if(c.length>2) obj.alt = c[2];
    return obj;
  });
  // Draw polyline on map
  const gpath = path.map(p=> new google.maps.LatLng(p.lat,p.lng));
  if(activePolyline) activePolyline.setMap(null);
  const poly = new google.maps.Polyline({
    path: gpath,
    strokeColor: '#4caf50',
    strokeWeight: 3,
    editable: routeEditEnabled,
    draggable: routeEditEnabled,
    map
  });
  setActivePolyline(poly);
  routePath = path;
  map.fitBounds((()=>{ const b=new google.maps.LatLngBounds(); gpath.forEach(g=>b.extend(g)); return b; })());
  resetPlayback();
}

function exportGeoJSON(){
  if(!routePath.length) { alert('No route'); return; }
  const geo = {
    type: "Feature",
    properties: {},
    geometry: {
      type: "LineString",
      coordinates: routePath.map(p=> [p.lng, p.lat, p.alt||0])
    }
  };
  const blob = new Blob([JSON.stringify(geo)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='route.geojson'; a.click(); URL.revokeObjectURL(url);
}

function exportKML(){
  if(!routePath.length) { alert('No route'); return; }

  const coordinates = routePath
    .map(p => `${p.lng},${p.lat},${p.alt || 0}`)
    .join('\n            ');

  const kml = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>Drone Route</name>
    <Placemark>
      <name>Route</name>
      <Style>
        <LineStyle>
          <color>ff33aaff</color>
          <width>3</width>
        </LineStyle>
      </Style>
      <LineString>
        <tessellate>1</tessellate>
        <coordinates>
            ${coordinates}
        </coordinates>
      </LineString>
    </Placemark>
  </Document>
</kml>`;

  const blob = new Blob([kml], {type:'application/vnd.google-earth.kml+xml'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'route.kml';
  a.click();
  URL.revokeObjectURL(url);
}

function resetPlayback(){
  pausePlayback();
  if(!droneMarker){
    droneMarker = new google.maps.Marker({ map, icon: iconDrone });
  }
  if(routePath.length) {
    droneMarker.setPosition(new google.maps.LatLng(routePath[0].lat, routePath[0].lng));
    playIndex = 0;
    lastTs = null;
  }
}

function startPlayback(){
  if(!routePath.length) { alert('No route to play'); return; }
  if(animationId) return; // already running
  const speedFactor = () => Number(document.getElementById('speed').value);
  const step = (timestamp)=>{
    if(!lastTs) lastTs = timestamp;
    const dt = (timestamp - lastTs) / 1000; // seconds
    lastTs = timestamp;
    // Simple speed model: move along polyline by index based on speedFactor
    const advance = dt * speedFactor() * 2; // tweak multiplier as needed
    playIndex += advance;
    if(playIndex >= routePath.length-1){ playIndex = routePath.length-1; pausePlayback(); return; }
    const i0 = Math.floor(playIndex);
    const t = playIndex - i0;
    const a = routePath[i0], b = routePath[i0+1];
    const lat = a.lat + (b.lat - a.lat)*t;
    const lng = a.lng + (b.lng - a.lng)*t;
    droneMarker.setPosition(new google.maps.LatLng(lat,lng));
    // rotate icon to heading
    const heading = google.maps.geometry.spherical.computeHeading(
      new google.maps.LatLng(a.lat,a.lng),
      new google.maps.LatLng(b.lat,b.lng)
    );
    droneMarker.setIcon(Object.assign({}, iconDrone, {rotation: heading}));
    animationId = requestAnimationFrame(step);
  };
  animationId = requestAnimationFrame(step);
}

function pausePlayback(){
  if(animationId) cancelAnimationFrame(animationId);
  animationId = null;
  lastTs = null;
}

window.onload = initMap;
</script>
</body>
</html>
