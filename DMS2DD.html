<div class="card">

<h1>DMS → Decimal Degrees</h1>

<p><strong>E) Section:</strong> Compact DMS coordinates. (435636N 0785747W)</p>

<input id="notam" aria-label="NOTAM E section coordinates" placeholder="435636N 0785747W">


<button class="btn btn-primary" onclick="convert()">Convert E)</button>

<div class="dms-panel">
<p><strong>Or enter each DMS component</strong></p>
<div class="dms-grid">
  <div class="dms-label">Latitude</div>
  <label>Degrees<input id="latDeg" type="number" min="0" max="90" step="1" placeholder="43"></label>
  <label>Minutes<input id="latMin" type="number" min="0" max="59" step="1" placeholder="36"></label>
  <label>Seconds<input id="latSec" type="number" min="0" max="59.999999" step="any" placeholder="29.66"></label>
  <label>Direction<select id="latHemi"><option value="N">N</option><option value="S">S</option></select></label>
  <div class="dms-label">Longitude</div>
  <label>Degrees<input id="lonDeg" type="number" min="0" max="180" step="1" placeholder="79"></label>
  <label>Minutes<input id="lonMin" type="number" min="0" max="59" step="1" placeholder="32"></label>
  <label>Seconds<input id="lonSec" type="number" min="0" max="59.999999" step="any" placeholder="51"></label>
  <label>Direction<select id="lonHemi"><option value="W">W</option><option value="E">E</option></select></label>
</div>
<button class="btn btn-primary" onclick="convertComponents()">Convert DMS fields</button>
</div>

<hr class="divider">

<p><strong>Q) Line</strong> — DDMMnDDDMMw + radius</p>

<input id="notamQ" placeholder="4357N07848W005">

<button class="btn btn-primary" onclick="convertQ()">Convert Q)</button>

<button class="btn btn-secondary btn-clear" onclick="clearFields()">CLEAR</button>

<div id="output"></div>
<a id="mapLink" target="_blank"></a>

</div>

<script>

function dmsToDD(deg, min, sec, hemi) {
    let dd = Number(deg) + Number(min)/60 + Number(sec)/3600;
    if (hemi === 'S' || hemi === 'W') dd *= -1;
    return dd;
}

function convert(skipClipboard) {

    let input = document.getElementById("notam").value.trim();

    // Preserve compact NOTAM format, and accept human-readable DMS without symbols.
    // Standard degree / prime symbols and keyboard quotes are optional.
    const compact = input.toUpperCase().match(/^(\d{2})(\d{2})(\d{2})([NS])\s*,?\s*(\d{3})(\d{2})(\d{2})([EW])$/);
    const spaced = input.toUpperCase()
        .replace(/[°º′’'″”"]/g, " ")
        .replace(/\s+/g, " ")
        .trim()
        .match(/^(\d{1,2}) (\d{1,2}) (\d{1,2}(?:\.\d+)?)\s*([NS])\s*,?\s*(\d{1,3}) (\d{1,2}) (\d{1,2}(?:\.\d+)?)\s*([EW])$/);
    const match = compact || spaced;

    const link = document.getElementById("mapLink");
    if (!match ||
        +match[1] > 90 || +match[2] >= 60 || +match[3] >= 60 ||
        +match[5] > 180 || +match[6] >= 60 || +match[7] >= 60 ||
        (+match[1] === 90 && (+match[2] !== 0 || +match[3] !== 0)) ||
        (+match[5] === 180 && (+match[6] !== 0 || +match[7] !== 0))) {
        document.getElementById("output").textContent =
            "Invalid DMS coordinates. Example: 43 36 29.66 N, 79 32 51 W";
        link.removeAttribute("href");
        link.textContent = "";
        return;
    }

    let lat = dmsToDD(match[1], match[2], match[3], match[4]);
    let lon = dmsToDD(match[5], match[6], match[7], match[8]);

    let result = lat.toFixed(6) + ", " + lon.toFixed(6);
    let gmaps = "https://www.google.com/maps?q=" + result;

    document.getElementById("output").innerHTML = "<strong>Lat/Lon:</strong> " + result;

    link.href = gmaps;
    link.innerHTML = "View on Google Maps";

    if (!skipClipboard && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(result).catch(() => {});
    }
}

function convertComponents() {
    const get = id => document.getElementById(id).value.trim();
    const parts = ["latDeg","latMin","latSec","lonDeg","lonMin","lonSec"].map(get);
    const link = document.getElementById("mapLink");
    const values = parts.map(Number);
    const valid = parts.every(v => v !== "" && Number.isFinite(Number(v))) &&
        values.every(v => v >= 0) &&
        Number.isInteger(values[0]) && Number.isInteger(values[1]) &&
        Number.isInteger(values[3]) && Number.isInteger(values[4]) &&
        values[0] <= 90 && values[3] <= 180 &&
        values[1] < 60 && values[2] < 60 &&
        values[4] < 60 && values[5] < 60 &&
        (values[0] !== 90 || (values[1] === 0 && values[2] === 0)) &&
        (values[3] !== 180 || (values[4] === 0 && values[5] === 0));
    if (!valid) {
        document.getElementById("output").textContent = "Enter valid degrees, minutes (0–59), and seconds (0–<60) for both coordinates.";
        link.removeAttribute("href"); link.textContent = "";
        return;
    }
    const lat = dmsToDD(values[0],values[1],values[2],get("latHemi"));
    const lon = dmsToDD(values[3],values[4],values[5],get("lonHemi"));
    const result = lat.toFixed(6) + ", " + lon.toFixed(6);
    document.getElementById("output").innerHTML = "<strong>Lat/Lon:</strong> " + result;
    link.href = "https://www.google.com/maps?q=" + result;
    link.textContent = "View on Google Maps";
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(result).catch(() => {});
}

function convertQ(skipClipboard) {
    let input = document.getElementById("notamQ").value.trim();

    // Q) line format: DDMM[N/S]DDDMM[E/W][RRR]
    let regex = /^(\d{2})(\d{2})([NS])(\d{3})(\d{2})([EW])(\d{3})?$/;
    let match = input.match(regex);

    if (!match) {
        document.getElementById("output").innerHTML = "Invalid Q) format — expected e.g. 4357N07848W005";
        document.getElementById("mapLink").href = "";
        document.getElementById("mapLink").innerHTML = "";
        return;
    }

    let lat = Number(match[1]) + Number(match[2]) / 60;
    let lon = Number(match[4]) + Number(match[5]) / 60;
    if (match[3] === 'S') lat *= -1;
    if (match[6] === 'W') lon *= -1;

    let result = lat.toFixed(6) + ", " + lon.toFixed(6);
    let gmaps = "https://www.google.com/maps?q=" + result;

    let html = "<strong>Lat/Lon:</strong> " + result;
    if (match[7]) {
        html += "<br><strong>Radius:</strong> " + Number(match[7]) + " NM";
    }

    document.getElementById("output").innerHTML = html;

    let link = document.getElementById("mapLink");
    link.href = gmaps;
    link.innerHTML = "View on Google Maps";

    if (!skipClipboard && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(result).catch(() => {});
    }
}

function clearFields() {
    document.getElementById("notam").value = "";
    document.getElementById("notamQ").value = "";
    ["latDeg","latMin","latSec","lonDeg","lonMin","lonSec"].forEach(id => document.getElementById(id).value = "");
    document.getElementById("latHemi").value = "N";
    document.getElementById("lonHemi").value = "W";
    document.getElementById("output").innerHTML = "";
    let link = document.getElementById("mapLink");
    link.href = "";
    link.innerHTML = "";
    document.getElementById("notam").focus();
}

function goBack(event) {
  event.preventDefault();
  if (window.history.length > 1) {
    window.history.back();
  } else {
    window.location.href = "tools.html";
  }
}

function getQueryParam(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
}

const prefill = getQueryParam("dms");
if (prefill) {
    document.getElementById("notam").value = prefill;
    convert(true);
} else {
    document.getElementById("notam").focus();
}

</script>

</body>
