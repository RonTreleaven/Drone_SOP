<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOTAM DMS to Decimal Degrees</title>

<style>
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #f4f6f8;
  margin: 0;
  padding: 0;
}

.top-nav {
  background: #2F5496;
  color: #fff;
  padding: 10px 0;
  text-align: center;
  font-size: 1.1em;
}

.top-nav a {
  color: #fff;
  text-decoration: none;
  margin: 0 10px;
}

.card {
  background: #fff;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  max-width: 400px;
  margin: 40px auto;
  padding: 28px 32px 24px 32px;
}

h1 {
  text-align: center;
  color: #2F5496;
  margin-bottom: 18px;
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 4px;
  border: 1px solid #ccc;
  font-size: 1em;
}

.btn {
  display: block;
  width: 100%;
  border: none;
  border-radius: 4px;
  padding: 12px;
  font-size: 1.05em;
  cursor: pointer;
  margin-top: 12px;
  transition: background 0.2s;
}

.btn-primary {
  background: #2F5496;
  color: #fff;
}

.btn-primary:hover {
  background: #b30000;
}

.btn-secondary {
  background: #ccc;
}

.btn-secondary:hover {
  background: #999;
}

#output {
  background: #eaf1fb;
  border-left: 4px solid #2F5496;
  padding: 12px;
  border-radius: 6px;
  margin-top: 16px;
  word-break: break-word;
}

#mapLink {
  display: block;
  margin-top: 12px;
  text-decoration: none;
  color: #2F5496;
  font-weight: bold;
}
</style>
</head>

<body>

<nav class="top-nav">
  <a href="#" onclick="goBack(event)">&larr; Back</a>
  | <a href="index.html">Home</a>
</nav>

<div class="card">

<h1>DMS → Decimal Degrees</h1>

<p>Enter NOTAM format coordinates:</p>

<input id="notam" placeholder="435636N 0785747W">

<button class="btn btn-primary" onclick="convert()">Convert</button>
<button class="btn btn-secondary" onclick="clearFields()">CLEAR</button>

<div id="output"></div>
<a id="mapLink" target="_blank"></a>

</div>

<script>

function dmsToDD(deg, min, sec, hemi) {
    let dd = Number(deg) + Number(min)/60 + Number(sec)/3600;
    if (hemi === 'S' || hemi === 'W') dd *= -1;
    return dd;
}

function convert() {

    let input = document.getElementById("notam").value.trim();

    let regex = /(\d{2})(\d{2})(\d{2})([NS])\s*(\d{3})(\d{2})(\d{2})([EW])/;

    let match = input.match(regex);

    if (!match) {
        document.getElementById("output").innerHTML = "Invalid format";
        return;
    }

    let lat = dmsToDD(match[1], match[2], match[3], match[4]);
    let lon = dmsToDD(match[5], match[6], match[7], match[8]);

    let result = lat.toFixed(6) + ", " + lon.toFixed(6);
    let gmaps = "https://www.google.com/maps?q=" + result;

    document.getElementById("output").innerHTML = "<strong>Lat/Lon:</strong> " + result;

    let link = document.getElementById("mapLink");
    link.href = gmaps;
    link.innerHTML = "View on Google Maps";

    navigator.clipboard.writeText(result);
}

function clearFields() {
    document.getElementById("notam").value = "";
    document.getElementById("output").innerHTML = "";
    let link = document.getElementById("mapLink");
    link.href = "";
    link.innerHTML = "";
    document.getElementById("notam").focus();
}

function goBack(event) {
  event.preventDefault();
  if (window.history.length > 1) {
    window.history.back();
  } else {
    window.location.href = "tools.html";
  }
}

document.getElementById("notam").focus();

</script>

</body>
</html>
