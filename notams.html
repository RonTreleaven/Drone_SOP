<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOTAM Search</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    .search-container {
      margin: 20px;
    }
    .search-container input {
      margin: 10px 0;
      padding: 8px;
      width: 300px;
    }
    .notam {
      border: 1px solid #ccc;
      margin: 10px 0;
      padding: 10px;
    }
  </style>
</head>
<body>
  <h1>Search NOTAMs</h1>
  <div class="search-container">
    <input type="text" id="firInput" placeholder="Enter FIR code (e.g., CZEG)">
    <input type="text" id="icaoInput" placeholder="Enter ICAO code (e.g., CYEG)">
    <button onclick="searchNotams()">Search</button>
  </div>
  <div id="results"></div>

  <script>
    // Load the JSON data (you can replace this with an API call if necessary)
    const notamDataUrl = "./data/notams/all_ca.json"; // Adjust the path as needed
    let notams = [];

    // Fetch NOTAM data from JSON file
    fetch(notamDataUrl)
      .then(response => response.json())
      .then(data => {
        notams = data;
        console.log("Loaded NOTAMs:", notams); // Debugging
      })
      .catch(error => console.error("Error fetching NOTAM data:", error));

    // Search Function
    function searchNotams() {
      const firInput = document.getElementById("firInput").value.toUpperCase();
      const icaoInput = document.getElementById("icaoInput").value.toUpperCase();
      const resultsContainer = document.getElementById("results");

      // Clear previous results
      resultsContainer.innerHTML = "";

      // Filter NOTAMs
      const filteredNotams = notams.filter(notam => {
        return (firInput === "" || notam.fir === firInput) &&
               (icaoInput === "" || notam.icao === icaoInput);
      });

      // Display results
      if (filteredNotams.length === 0) {
        resultsContainer.innerHTML = "<p>No matching NOTAMs found.</p>";
      } else {
        filteredNotams.forEach(notam => {
          resultsContainer.innerHTML += `
            <div class="notam">
              <p><strong>FIR:</strong> ${notam.fir}</p>
              <p><strong>ICAO:</strong> ${notam.icao}</p>
              <p><strong>Valid From:</strong> ${notam.validFrom}</p>
              <p><strong>Valid To:</strong> ${notam.validTo}</p>
              <p><strong>Description:</strong> ${notam.description}</p>
            </div>
          `;
        });
      }
    }
  </script>
</body>
</html>
