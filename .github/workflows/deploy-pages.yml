name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "*.js"
      - "*.png"
      - "*.ico"
      - "*.svg"
      - "assets/**"
      - "sections/**"
      - "data/**"
      - ".github/workflows/deploy-pages.yml"
      - "_config.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Build site artifact
        run: |
          mkdir -p _site/assets/js _site/assets/css _site/assets/img \
                   _site/assets/Emergency _site/assets/CFS _site/assets/pdf \
                   _site/data/notams _site/data/airspace/_sources \
                   _site/data/schema _site/sections

          # Root-level HTML pages
          cp *.html _site/

          # Root-level JS (e.g. cords.js)
          cp *.js _site/ 2>/dev/null || true

          # Root-level images and favicons
          cp *.png *.ico *.svg _site/ 2>/dev/null || true

          # Assets — explicit subfolders only (excludes logs/ and MD/)
          cp assets/css/*.css   _site/assets/css/   2>/dev/null || true
          cp assets/js/*.js     _site/assets/js/    2>/dev/null || true
          cp assets/js/*.css    _site/assets/js/    2>/dev/null || true
          cp -r assets/img      _site/assets/
          cp -r assets/Emergency _site/assets/      2>/dev/null || true
          cp -r assets/CFS      _site/assets/       2>/dev/null || true
          cp -r assets/pdf      _site/assets/       2>/dev/null || true

          # Sections (SOP procedure pages)
          cp sections/*.html _site/sections/

          # Data — reference JSON/GeoJSON files (root of data/)
          cp data/*.json data/*.geojson _site/data/ 2>/dev/null || true

          # Data — airspace files used by CZMiniMap and related tools
          cp data/airspace/*.geojson _site/data/airspace/ 2>/dev/null || true
          cp data/airspace/*.geoJson _site/data/airspace/ 2>/dev/null || true

          # Refreshed source data used by DAHminimap and the home page
          cp -r data/airspace/_sources/. _site/data/airspace/_sources/

          # Data — live NOTAM JSON files (auto-updated by fetch-notams CRON)
          cp data/notams/*.json _site/data/notams/  2>/dev/null || true

          # JSON schemas referenced by RC2 documentation and manifests
          cp data/schema/*.schema.json _site/data/schema/

          # Data - RC2 automation bundle (scripts, docs, index)
          cp -r data/rc2 _site/data/

          # Disable Jekyll processing
          touch _site/.nojekyll

      - name: Summarize site artifact
        run: |
          du -sh _site
          find _site -type f | wc -l

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
          reporting_interval: 10000
