name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Fetch Drone Jobs
    types:
      - completed
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "*.js"
      - "*.png"
      - "*.ico"
      - "*.svg"
      - "assets/css/**"
      - "assets/js/**"
      - "assets/img/**"
      - "assets/CFS/**"
      - "assets/Emergency/*.md"
      - "assets/pdf/MyFactSheet.pdf"
      - "sections/**"
      - "data/*.json"
      - "data/*.csv"
      - "data/*.geojson"
      - "data/notams/**"
      - "data/airspace/*.geojson"
      - "data/airspace/*.geoJson"
      - "data/airspace/_sources/*.geojson"
      - "data/airspace/_sources/*.geoJson"
      - "data/airspace/_sources/*.csv"
      - "data/airspace/_sources/*.json"
      - "data/schema/*.schema.json"
      - "data/rc2/**"
      - "Advanced_RPAS_Study/quiz.html"
      - "Advanced_RPAS_Study/index.html"
      - "Advanced_RPAS_Study/data/questions.json"
      - "Advanced_RPAS_Study/data/references.json"
      - "Advanced_RPAS_Study/data/~tmp40_categories.json"
      - "Advanced_RPAS_Study/docs/Aeronautics Act R.S.C._A-2.pdf"
      - "Advanced_RPAS_Study/docs/CARs_SOR-96-433_FullText.pdf"
      - "Advanced_RPAS_Study/docs/aim-2026-1_rpa_en_March 19_2026 .pdf"
      - "Advanced_RPAS_Study/docs/NAVCANADA_DAH_current_20260709.pdf"
      - "Advanced_RPAS_Study/docs/NAVCANADA_VFR-Phraseology.pdf"
      - "Advanced_RPAS_Study/docs/TP15263_E_Knowledge-Requirements-Basic-Advanced.pdf"
      - ".github/workflows/deploy-pages.yml"
      - "_config.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build site artifact
        run: |
          set -Eeuo pipefail

          rm -rf _site
          mkdir -p _site/assets/js _site/assets/css \
                   _site/assets/Emergency _site/assets/pdf \
                   _site/data/notams _site/data/airspace/_sources \
                   _site/data/schema _site/sections \
                   _site/Advanced_RPAS_Study/data _site/Advanced_RPAS_Study/docs

          # Root-level HTML pages (exclude local backups/drafts)
          find . -maxdepth 1 -type f -name "*.html" \
            ! -name "NotamsMap.safe_backup.*.html" \
            ! -name "_bu_index.html" \
            ! -name "GGcode-backup.html" \
            -exec cp {} _site/ \;

          # Root-level JS (e.g. cords.js)
          find . -maxdepth 1 -type f -name "*.js" -exec cp {} _site/ \;

          # Root-level images and favicons
          find . -maxdepth 1 -type f \( -name "*.png" -o -name "*.ico" -o -name "*.svg" \) \
            -exec cp {} _site/ \;

          # Assets - explicit subfolders only (excludes logs/ and MD/)
          find assets/css -maxdepth 1 -type f -name "*.css" -exec cp {} _site/assets/css/ \;
          find assets/js -maxdepth 1 -type f \( -name "*.js" -o -name "*.css" \) \
            -exec cp {} _site/assets/js/ \;
          cp -a assets/img _site/assets/
          find assets/Emergency -maxdepth 1 -type f -name "*.md" -exec cp {} _site/assets/Emergency/ \;
          if [ -d assets/CFS ]; then cp -a assets/CFS _site/assets/; fi
          # Publish only PDFs referenced by live pages
          if [ -f assets/pdf/MyFactSheet.pdf ]; then cp assets/pdf/MyFactSheet.pdf _site/assets/pdf/; fi

          # Sections (SOP procedure pages)
          cp sections/*.html _site/sections/

          # Data - reference JSON/GeoJSON/CSV files (root of data/)
          find data -maxdepth 1 -type f \( -name "*.json" -o -name "*.geojson" -o -name "*.csv" \) \
            ! -name "May11_2026ca_asp.geojson" \
            -exec cp {} _site/data/ \;

          # Data - airspace files used by CZMiniMap and related tools
          cp data/airspace/*.geojson _site/data/airspace/ 2>/dev/null || true
          cp data/airspace/*.geoJson _site/data/airspace/ 2>/dev/null || true

          # Refreshed source data used by DAHminimap and the home page
          cp data/airspace/_sources/*.geojson _site/data/airspace/_sources/ 2>/dev/null || true
          cp data/airspace/_sources/*.geoJson _site/data/airspace/_sources/ 2>/dev/null || true
          cp data/airspace/_sources/*.csv _site/data/airspace/_sources/ 2>/dev/null || true
          cp data/airspace/_sources/*.json _site/data/airspace/_sources/ 2>/dev/null || true

          # Data - live NOTAM JSON files (auto-updated by fetch-notams CRON)
          cp data/notams/*.json _site/data/notams/  2>/dev/null || true

          # JSON schemas referenced by RC2 documentation and manifests
          cp data/schema/*.schema.json _site/data/schema/

          # Data - RC2 automation bundle (scripts, docs, index)
          cp -r data/rc2 _site/data/

           # Advanced RPAS quiz: deploy only browser runtime files and linked source PDFs.
           cp Advanced_RPAS_Study/quiz.html Advanced_RPAS_Study/index.html _site/Advanced_RPAS_Study/
           cp Advanced_RPAS_Study/data/questions.json \
             Advanced_RPAS_Study/data/references.json \
             Advanced_RPAS_Study/data/~tmp40_categories.json \
             _site/Advanced_RPAS_Study/data/
           cp "Advanced_RPAS_Study/docs/Aeronautics Act R.S.C._A-2.pdf" \
             "Advanced_RPAS_Study/docs/CARs_SOR-96-433_FullText.pdf" \
             "Advanced_RPAS_Study/docs/aim-2026-1_rpa_en_March 19_2026 .pdf" \
             "Advanced_RPAS_Study/docs/NAVCANADA_DAH_current_20260709.pdf" \
             "Advanced_RPAS_Study/docs/NAVCANADA_VFR-Phraseology.pdf" \
             "Advanced_RPAS_Study/docs/TP15263_E_Knowledge-Requirements-Basic-Advanced.pdf" \
             _site/Advanced_RPAS_Study/docs/

          # Disable Jekyll processing
          touch _site/.nojekyll

          test -f _site/index.html
          test -f _site/JobBoard.html
          test -f _site/data/jobs.json
          test -f _site/Advanced_RPAS_Study/quiz.html
          test -f _site/Advanced_RPAS_Study/data/questions.json
          test -f _site/Advanced_RPAS_Study/data/references.json

      - name: Summarize site artifact
        run: |
          set -Eeuo pipefail
          du -sh _site
          find _site -type f | wc -l
          find _site -type l -print -quit | awk '{ print "Symlink found in Pages artifact: " $0; exit 1 }'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
          reporting_interval: 10000
