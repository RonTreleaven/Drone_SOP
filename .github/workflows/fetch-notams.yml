name: Fetch NOTAMs

on:
  schedule:
    - cron: '0 10 * * *'  # runs at 10 UTC, 6AM EDT
    - cron: '0 16 * * *'  # runs at 16 UTC, 12 noon
    - cron: '0 20 * * *'  # runs at 20 UTC, 4PM EDT
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Grant write permission to the workflow
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run NOTAM script
        run: node scripts/JS_Notam_All_CABuilder.js

      - name: Verify generated files
        run: |
          test -f data/notams/All_CA.json
          test -f data/notams/All_CA_raw.json
          test -f data/notams/All_CA.meta.json

      - name: Commit and push JSON files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A data/notams
          git diff --staged --quiet || git commit -m "Auto-update NOTAMs $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
