name: Fetch NOTAMs

on:
  schedule:
    - cron: '0 0 * * *'   # runs daily at midnight
  workflow_dispatch:        # allows manual trigger from GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Grant write permission to the workflow
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run NOTAM script
        run: node scripts/JS_Notam_All_CABuilder.js

      - name: Move JSON files to data folder
        run: |
          mkdir -p data/notams
          rm -f data/notams/*.json   # Remove existing JSON files
          mv *.json data/notams/

      - name: Commit and push JSON files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/notams/*.json
          git diff --staged --quiet || git commit -m "Auto-update NOTAMs $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
