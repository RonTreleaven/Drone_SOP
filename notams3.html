<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOTAM Search</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
    }

    .top-nav {
      background: #2F5496;
      color: #fff;
      padding: 10px 0;
      text-align: center;
      font-size: 1.1em;
    }

    .top-nav a {
      color: #fff;
      text-decoration: none;
      margin: 0 10px;
    }

    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      max-width: 860px;
      margin: 40px auto;
      padding: 28px 32px 24px 32px;
    }

    h1 {
      text-align: center;
      color: #2F5496;
      margin-bottom: 18px;
    }

    .fir-table-wrap {
      margin-bottom: 18px;
    }

    .fir-table-wrap h2 {
      color: #2F5496;
      margin: 0 0 8px 0;
      font-size: 1rem;
    }

    .fir-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
      background: #fff;
    }

    .fir-table th,
    .fir-table td {
      border: 1px solid #d9e3f3;
      padding: 6px 8px;
      text-align: left;
    }

    .fir-table th {
      background: #eaf1fb;
      color: #1f3e72;
    }

    .search-container {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 12px;
      align-items: end;
      margin-bottom: 16px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
    }

    .field-group label {
      font-weight: 600;
      color: #2F5496;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 1em;
      box-sizing: border-box;
    }

    .btn {
      border: none;
      border-radius: 4px;
      padding: 12px 16px;
      font-size: 1.05em;
      cursor: pointer;
      transition: background 0.2s;
      background: #2F5496;
      color: #fff;
      white-space: nowrap;
    }

    .btn:hover {
      background: #b30000;
    }

    #results p {
      margin: 0.5rem 0;
    }

    .notam {
      background: #eaf1fb;
      border-left: 4px solid #2F5496;
      border-radius: 6px;
      padding: 12px;
      margin-top: 12px;
      word-break: break-word;
    }

    @media (max-width: 760px) {
      .card {
        margin: 20px 12px;
        padding: 20px 16px;
      }

      .search-container {
        grid-template-columns: 1fr;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <nav class="top-nav">
    <a href="#" onclick="goBack(event)">&larr; Back</a>
    | <a href="index.html">Home</a>
  </nav>

  <div class="card">
    <h1>Search NOTAMs</h1>

    <div class="fir-table-wrap">
      <h2>Canadian FIR Reference</h2>
      <table class="fir-table">
        <thead>
          <tr>
            <th>Region</th>
            <th>FIR Code</th>
            <th>NOTAM Count</th>
            <th>NOTAM Data gathered</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>Vancouver</td><td>CZVR</td><td data-fir-count="CZVR">0</td><td data-fir-date>Loading...</td></tr>
          <tr><td>Edmonton</td><td>CZEG</td><td data-fir-count="CZEG">0</td><td data-fir-date>Loading...</td></tr>
          <tr><td>Winnipeg</td><td>CZWG</td><td data-fir-count="CZWG">0</td><td data-fir-date>Loading...</td></tr>
          <tr><td>Toronto</td><td>CZYZ</td><td data-fir-count="CZYZ">0</td><td data-fir-date>Loading...</td></tr>
          <tr><td>Montreal</td><td>CZUL</td><td data-fir-count="CZUL">0</td><td data-fir-date>Loading...</td></tr>
          <tr><td>Moncton</td><td>CZQM</td><td data-fir-count="CZQM">0</td><td data-fir-date>Loading...</td></tr>
          <tr><td>Gander</td><td>CZQX</td><td data-fir-count="CZQX">0</td><td data-fir-date>Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <form id="searchForm" class="search-container">
      <div class="field-group">
        <label for="firInput">FIR</label>
        <input type="text" id="firInput" placeholder="Enter FIR code (e.g., CZEG)">
      </div>
      <div class="field-group">
        <label for="icaoInput">ICAO</label>
        <input type="text" id="icaoInput" placeholder="Enter ICAO code (e.g., CYEG)">
      </div>
      <button class="btn" type="submit">Search</button>
    </form>

    <div id="results"></div>
  </div>

  <script>
    const notamDataUrl = "./data/notams/All_CA.json";
    const notamMetaUrl = "./data/notams/All_CA.meta.json";
    let notams = [];
    let dataRefreshDate = "Unavailable";

    fetch(notamDataUrl)
      .then(response => {
        if (!response.ok) {
          throw new Error(`Network error! Status: ${response.status}`);
        }
        return response.json();
      })
      .then(data => {
        if (Array.isArray(data)) {
          notams = data;
          dataRefreshDate = "Unavailable (generatedAt missing)";
        } else {
          notams = Array.isArray(data.notams) ? data.notams : [];
          if (data.generatedAt) {
            dataRefreshDate = formatDataDate(data.generatedAt);
          } else {
            dataRefreshDate = "Unavailable (generatedAt missing)";
          }
        }
        updateFirCounts();
        updateFirDates();
        return fetchGeneratedAtDate();
      })
      .then(generatedAtDate => {
        if (generatedAtDate) {
          dataRefreshDate = `${generatedAtDate} (generatedAt)`;
          updateFirDates();
        }
      })
      .catch(error => {
        console.error("Error fetching NOTAM data:", error);
        updateFirDates("Unavailable");
      });

    function formatDataDate(headerValue) {
      if (!headerValue) return "Unavailable";
      const parsed = new Date(headerValue);
      if (Number.isNaN(parsed.getTime())) return "Unavailable";
      return parsed.toLocaleString("en-CA", {
        year: "numeric",
        month: "short",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      });
    }

    function updateFirDates(forceValue) {
      const displayDate = forceValue || dataRefreshDate;
      document.querySelectorAll("[data-fir-date]").forEach(cell => {
        cell.textContent = displayDate;
      });
    }

    function fetchGeneratedAtDate() {
      return fetch(notamMetaUrl)
        .then(response => {
          if (!response.ok) {
            throw new Error(`Meta file error: ${response.status}`);
          }
          return response.json();
        })
        .then(meta => {
          const generatedAt = meta?.generatedAt;
          if (!generatedAt) return null;
          return formatDataDate(generatedAt);
        })
        .catch(error => {
          console.warn("Could not read generatedAt from All_CA.meta.json:", error);
          return null;
        });
    }

    function updateFirCounts() {
      const firCounts = {
        CZVR: 0,
        CZEG: 0,
        CZWG: 0,
        CZYZ: 0,
        CZUL: 0,
        CZQM: 0,
        CZQX: 0
      };

      notams.forEach(notam => {
        const rawText = notam.raw || "";
        const firMatch = rawText.match(/Q\)\s*([A-Z]{4})/);
        if (!firMatch) return;

        const firCode = firMatch[1];
        if (firCounts.hasOwnProperty(firCode)) {
          firCounts[firCode] += 1;
        }
      });

      Object.keys(firCounts).forEach(firCode => {
        const cell = document.querySelector(`[data-fir-count="${firCode}"]`);
        if (cell) cell.textContent = firCounts[firCode];
      });
    }

    function searchNotams() {
      const firInput = document.getElementById("firInput").value.trim().toUpperCase();
      const icaoInput = document.getElementById("icaoInput").value.trim().toUpperCase();
      const resultsContainer = document.getElementById("results");

      resultsContainer.innerHTML = "";

      if (firInput === "" && icaoInput === "") {
        resultsContainer.innerHTML = "<p>Please enter FIR or ICAO code to search.</p>";
        return;
      }

      const filteredNotams = notams.filter(notam => {
        const rawText = notam.raw || "";

        const firMatch = rawText.match(/Q\)\s*([A-Z]{4})/);
        const icaoMatch = rawText.match(/A\)\s*([A-Z]{4})/);

        const firFound = firMatch ? firMatch[1] : null;
        const icaoFound = icaoMatch ? icaoMatch[1] : null;

        return (firInput === "" || (firFound && firFound === firInput)) &&
               (icaoInput === "" || (icaoFound && icaoFound === icaoInput));
      });

      if (filteredNotams.length === 0) {
        resultsContainer.innerHTML = "<p>No matching NOTAMs found.</p>";
        return;
      }

      filteredNotams.forEach(notam => {
        const firMatch = (notam.raw || "").match(/Q\)\s*([A-Z]{4})/);
        const icaoMatch = (notam.raw || "").match(/A\)\s*([A-Z]{4})/);
        const firOutput = firMatch ? firMatch[1] : "N/A";
        const icaoOutput = icaoMatch ? icaoMatch[1] : "N/A";
        const cleanedDescription = (notam.raw || "").replace(/[\r\n]+/g, " ").trim();

        resultsContainer.innerHTML += `
          <div class="notam">
            <p><strong>FIR:</strong> ${firOutput}</p>
            <p><strong>ICAO:</strong> ${icaoOutput}</p>
            <p><strong>Valid From:</strong> ${notam.startValidity || "N/A"}</p>
            <p><strong>Valid To:</strong> ${notam.endValidity || "N/A"}</p>
            <p><strong>Description:</strong> ${cleanedDescription}</p>
          </div>
        `;
      });
    }

    function goBack(event) {
      event.preventDefault();
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "tools.html";
      }
    }

    document.getElementById("searchForm").addEventListener("submit", function (event) {
      event.preventDefault();
      searchNotams();
    });

    document.getElementById("firInput").focus();
  </script>
</body>
</html>
