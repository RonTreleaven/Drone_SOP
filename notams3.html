<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOTAM Search</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    .search-container {
      margin: 20px;
    }
    .search-container input {
      margin: 10px 0;
      padding: 8px;
      width: 300px;
    }
    .notam {
      border: 1px solid #ccc;
      margin: 10px 0;
      padding: 10px;
    }
  </style>
</head>
<body>
  <h1>Search NOTAMs</h1>
  <div class="search-container">
    <input type="text" id="firInput" placeholder="Enter FIR code (e.g., CZEG)">
    <input type="text" id="icaoInput" placeholder="Enter ICAO code (e.g., CYEG)">
    <button onclick="searchNotams()">Search</button>
  </div>
  <div id="results"></div>

  <script>
    const notamDataUrl = "./data/notams/All_CA.json"; 
    let notams = [];

    // Fetch NOTAM data from JSON file
    fetch(notamDataUrl)
      .then(response => {
        if (!response.ok) {
          throw new Error(`Network error! Status: ${response.status}`);
        }
        return response.json();
      })
      .then(data => {
        notams = data;
        console.log("Loaded NOTAMs:", JSON.stringify(notams, null, 2)); // Log structured data
      })
      .catch(error => console.error("Error fetching NOTAM data:", error));

    // Updated Search Function
    function searchNotams() {
        const firInput = document.getElementById("firInput").value.trim().toUpperCase();
        const icaoInput = document.getElementById("icaoInput").value.trim().toUpperCase();
        const resultsContainer = document.getElementById("results");

        // Clear previous results
        resultsContainer.innerHTML = "";

        // Log total NOTAMs
        console.log("Total NOTAMs loaded:", notams.length);
        
        // Filter NOTAMs only if inputs are provided
        if (firInput === "" && icaoInput === "") {
            resultsContainer.innerHTML = "<p>Please enter FIR or ICAO code to search.</p>";
            return; // Exit the function if no input
        }
        
        const filteredNotams = notams.filter(notam => {
            const rawText = notam.raw;

            const firMatch = rawText.match(/Q\)\s*([A-Z]{4})/);
            const icaoMatch = rawText.match(/A\)\s*([A-Z]{4})/);
            
            const firFound = firMatch ? firMatch[1] : null;
            const icaoFound = icaoMatch ? icaoMatch[1] : null;
            
            console.log("Checking NOTAM:", notam, "| Extracted FIR:", firFound, "| Extracted ICAO:", icaoFound);

            // Return true if the NOTAM matches the search criteria
            return (firInput === "" || (firFound && firFound === firInput)) &&
                   (icaoInput === "" || (icaoFound && icaoFound === icaoInput));
        });

        // Log filtered results
        console.log("Filtered NOTAMs:", filteredNotams); 
        if (filteredNotams.length === 0) {
            resultsContainer.innerHTML = "<p>No matching NOTAMs found.</p>";
        } else {
            filteredNotams.forEach(notam => {
                const firMatch = notam.raw.match(/Q\)\s*([A-Z]{4})/);
                const icaoMatch = notam.raw.match(/A\)\s*([A-Z]{4})/);
                const firOutput = firMatch ? firMatch[1] : 'N/A';
                const icaoOutput = icaoMatch ? icaoMatch[1] : 'N/A';

                // Clean up the raw description by replacing line breaks with spaces
                const cleanedDescription = notam.raw.replace(/[\r\n]+/g, ' ').trim();

                resultsContainer.innerHTML += `
                    <div class="notam">
                        <p><strong>FIR:</strong> ${firOutput}</p>
                        <p><strong>ICAO:</strong> ${icaoOutput}</p>
                        <p><strong>Valid From:</strong> ${notam.startValidity}</p>
                        <p><strong>Valid To:</strong> ${notam.endValidity}</p>
                        <p><strong>Description:</strong> ${cleanedDescription}</p>
                    </div>
                `;
            });
        }
    }
  </script>
</body>
</html>
