<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAH Gold Airspace Map</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="assets/css/site-nav.css">
  <script src="assets/js/site-nav.js" defer></script>
  <style>
    :root {
      --bg: #f0f2f5;
      --panel: #ffffff;
      --line: #c9d0d9;
      --ink: #1f2c3a;
      --muted: #5e6f82;
      --accent: #0f5a92;
      --warn: #8a4a00;
      --ok: #1d6b3c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: Tahoma, "Segoe UI", sans-serif;
    }

    .page {
      height: 100vh;
      display: grid;
      grid-template-columns: 360px 1fr;
      grid-template-rows: auto 1fr;
      gap: 0;
    }

    .page.filters-collapsed {
      grid-template-columns: 1fr;
    }

    .page.filters-collapsed .side {
      display: none;
    }

    .top {
      grid-column: 1 / 3;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      padding: 0.4rem 0.7rem;
    }

    .side {
      border-right: 1px solid var(--line);
      background: var(--panel);
      padding: 0.75rem;
      overflow: auto;
    }

    .main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: var(--panel);
    }

    .map-tools {
      border-bottom: 1px solid var(--line);
      padding: 0.4rem 0.55rem;
      display: flex;
      gap: 0.45rem;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 1.1rem;
    }

    .sub {
      margin: 0.35rem 0 0.7rem;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .group {
      margin-bottom: 0.8rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.55rem;
      background: #fbfcfe;
    }

    .group h2 {
      margin: 0 0 0.45rem;
      font-size: 0.86rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #34516b;
    }

    .row {
      display: flex;
      gap: 0.4rem;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 0.45rem;
    }

    label { font-size: 0.9rem; }

    input[type="text"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.42rem 0.48rem;
      font-size: 0.9rem;
    }

    .half {
      width: calc(50% - 0.2rem);
    }

    button {
      border: 1px solid #88a7c4;
      background: #fff;
      color: var(--ink);
      border-radius: 6px;
      padding: 0.35rem 0.55rem;
      font-size: 0.84rem;
      cursor: pointer;
    }

    button.primary {
      background: var(--accent);
      border-color: #0c4b7c;
      color: #fff;
    }

    .status {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.45rem 0.55rem;
      font-size: 0.86rem;
      background: #f7f9fc;
    }

    .status.ok {
      border-color: #b9dfc8;
      background: #edf8f1;
      color: var(--ok);
    }

    .status.warn {
      border-color: #edcf9f;
      background: #fff6e9;
      color: var(--warn);
    }

    #map {
      width: 100%;
      flex: 1;
      min-height: 260px;
    }

    .legend {
      font-size: 0.83rem;
      color: var(--muted);
      line-height: 1.35;
    }

    .cycle-meta {
      margin-top: 0.45rem;
    }

    @media (max-width: 980px) {
      .page {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto 1fr;
      }
      .top { grid-column: 1; }
      .side { border-right: none; border-bottom: 1px solid var(--line); max-height: 44vh; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="top">
      <nav class="shared-site-nav" data-nav-variant="utility" data-show-back="true" data-back-fallback="tools.html"></nav>
    </div>

    <aside class="side">
      <h1>DAH Gold Airspace</h1>
      <p class="sub">Transport Canada DAH parser output, refreshed on each 56-day cycle.</p>

      <section class="group">
        <h2>Class Filter</h2>
        <div class="row">
          <label><input type="checkbox" class="class-filter" value="D" checked> D</label>
          <label><input type="checkbox" class="class-filter" value="F" checked> F</label>
        </div>
        <div class="row">
          <button id="classCheckAll">Check</button>
          <button id="classUncheckAll">Unchk</button>
        </div>
      </section>

      <section class="group">
        <h2>Type Filter</h2>
        <div class="row">
          <label><input type="checkbox" class="type-filter" value="RESTRICTED" checked> CYR Restricted</label>
          <label><input type="checkbox" class="type-filter" value="DANGER" checked> CYD Danger</label>
          <label><input type="checkbox" class="type-filter" value="ADVISORY" checked> CYA Advisory</label>
          <label><input type="checkbox" class="type-filter" value="CONTROL_ZONE" checked> Control Zone</label>
          <label><input type="checkbox" class="type-filter" value="TRANSITION_AREA" checked> Transition Area</label>
          <label><input type="checkbox" class="type-filter" value="TERMINAL_CONTROL_AREA" checked> Terminal Control Area</label>
          <label><input type="checkbox" class="type-filter" value="MOA"> MOA</label>
          <label><input type="checkbox" class="type-filter" value="ADIZ"> ADIZ</label>
          <label><input type="checkbox" class="type-filter" value="OTHER" checked> Other</label>
        </div>
        <div class="row">
          <button id="typeCheckAll">Check</button>
          <button id="typeUncheckAll">Unchk</button>
        </div>
      </section>

      <section class="group">
        <h2>Airspace Checker</h2>
        <div class="row">
          <input id="latInput" class="half" type="text" placeholder="Latitude">
          <input id="lonInput" class="half" type="text" placeholder="Longitude">
        </div>
        <div class="row">
          <button id="checkBtn" class="primary">Check Airspace</button>
          <button id="fitBtn">Fit Visible</button>
          <button id="locBtn">My Location</button>
          <button id="focusPilotBtn">Center on Pilot</button>
        </div>
      </section>

      <section class="group">
        <h2>Status</h2>
        <div id="status" class="status">Loading parsed DAH airspace...</div>
        <div id="cycleMeta" class="legend cycle-meta"></div>
      </section>

      <section class="legend">
        Fields shown in popup: id, class, designation, type, lower, upper, active, section.
      </section>
    </aside>

    <main class="main" id="mapMain">
      <div class="map-tools">
        <button id="toggleFiltersBtn" type="button">Collapse Filters</button>
        <button id="fullscreenMapBtn" type="button">Full Screen Map</button>
      </div>
      <div id="map"></div>
    </main>
  </div>

  <script>
    const map = L.map("map", { zoomControl: true, preferCanvas: true }).setView([56.1304, -106.3468], 4);

    const osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18,
      attribution: "&copy; OpenStreetMap contributors"
    });

    const satellite = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 18,
      attribution: "Tiles &copy; Esri"
    });

    osm.addTo(map);
    L.control.layers({ Map: osm, Satellite: satellite }, {}, { collapsed: false }).addTo(map);

    const airspaceLayer = L.geoJSON(null, {
      style: (feature) => {
        const p = feature.properties || {};
        if (p.zone_type === "RESTRICTED" || p.designation === "Restricted") {
          return { color: "#8f1f1f", weight: 1.8, fillColor: "#c94949", fillOpacity: 0.16 };
        }
        if (p.zone_type === "DANGER" || p.designation === "Danger") {
          return { color: "#7f3b00", weight: 1.6, fillColor: "#d37d26", fillOpacity: 0.15 };
        }
        if (p.zone_type === "ADVISORY" || p.designation === "Advisory") {
          return { color: "#6b4f00", weight: 1.3, fillColor: "#c8a546", fillOpacity: 0.12 };
        }
        if (p.class === "D") {
          return { color: "#164a86", weight: 1.4, fillColor: "#3e7bc7", fillOpacity: 0.12 };
        }
        return { color: "#7b4a14", weight: 1.2, fillColor: "#cb8f4a", fillOpacity: 0.1 };
      },
      onEachFeature: (feature, layer) => {
        const p = feature.properties || {};
        const name = (p.name || "Unnamed").toString();
        const id = (p.id || "n/a").toString();
        layer.bindPopup(
          "<strong>" + name + "</strong><br>" +
          "ID: " + id + "<br>" +
          "Class: " + (p.class || "") + "<br>" +
          "Designation: " + (p.designation || "") + "<br>" +
          "Type: " + (p.zone_type || "") + "<br>" +
          "Lower: " + (p.lower || "") + "<br>" +
          "Upper: " + (p.upper || "") + "<br>" +
          "Active: " + (p.active || "") + "<br>" +
          "Section: " + (p.section || "")
        );
      }
    }).addTo(map);

    let sourceData = null;
    let pilotMarker = null;
    let pilotAccuracy = null;
    let locationWatchId = null;

    function setStatus(text, tone) {
      const el = document.getElementById("status");
      el.textContent = text;
      el.className = "status" + (tone ? " " + tone : "");
    }

    function selectedClassSet() {
      return new Set(Array.from(document.querySelectorAll(".class-filter:checked")).map((el) => el.value));
    }

    function selectedTypeSet() {
      return new Set(Array.from(document.querySelectorAll(".type-filter:checked")).map((el) => el.value));
    }

    function featureType(p) {
      if (p.zone_type) return String(p.zone_type).toUpperCase();
      const id = String(p.id || "").toUpperCase();
      if (id.startsWith("CYR")) return "RESTRICTED";
      if (id.startsWith("CYD")) return "DANGER";
      if (id.startsWith("CYA")) return "ADVISORY";
      const d = String(p.designation || "").toUpperCase();
      if (d === "RESTRICTED") return "RESTRICTED";
      if (d === "DANGER") return "DANGER";
      if (d === "ADVISORY") return "ADVISORY";
      const name = String(p.name || "").toUpperCase();
      if (name.includes("CONTROL ZONE") || name.includes(" CTR") || name.endsWith(" CTR")) return "CONTROL_ZONE";
      if (name.includes("TRANSITION AREA") || name.includes(" TA")) return "TRANSITION_AREA";
      if (name.includes("TERMINAL CONTROL AREA") || name.includes(" TCA")) return "TERMINAL_CONTROL_AREA";
      if (name.includes("MOA")) return "MOA";
      if (name.includes("ADIZ")) return "ADIZ";
      if (String(p.class || "").toUpperCase() === "D") return "CONTROL_ZONE";
      return "OTHER";
    }

    function featurePasses(feature, classes, types) {
      const p = feature.properties || {};
      const type = featureType(p);
      if (!types.has(type)) return false;

      // Keep restricted/danger/advisory visible independently of class filters.
      if (type === "RESTRICTED" || type === "DANGER" || type === "ADVISORY") {
        return true;
      }

      return classes.has(String(p.class || "").toUpperCase());
    }

    function updatePilotLocation(lat, lon, accuracyM) {
      document.getElementById("latInput").value = lat.toFixed(6);
      document.getElementById("lonInput").value = lon.toFixed(6);

      if (!pilotMarker) {
        pilotMarker = L.circleMarker([lat, lon], {
          radius: 7,
          color: "#0f5a92",
          fillColor: "#1e87ff",
          fillOpacity: 0.85,
          weight: 2
        }).addTo(map);
      } else {
        pilotMarker.setLatLng([lat, lon]);
      }

      if (Number.isFinite(accuracyM) && accuracyM > 0) {
        if (!pilotAccuracy) {
          pilotAccuracy = L.circle([lat, lon], {
            radius: accuracyM,
            color: "#1e87ff",
            weight: 1,
            opacity: 0.5,
            fillColor: "#1e87ff",
            fillOpacity: 0.08
          }).addTo(map);
        } else {
          pilotAccuracy.setLatLng([lat, lon]);
          pilotAccuracy.setRadius(accuracyM);
        }
      }
    }

    function focusOnPilotArea() {
      if (!pilotMarker) {
        setStatus("Pilot location not set yet. Use My Location first.", "warn");
        return;
      }

      const ll = pilotMarker.getLatLng();
      map.setView([ll.lat, ll.lng], Math.max(map.getZoom(), 11), { animate: true });

      const localWindowBounds = L.circle([ll.lat, ll.lng], { radius: 8000 }).getBounds();
      map.fitBounds(localWindowBounds, { padding: [24, 24], maxZoom: 12, animate: true });

      setStatus("Focused on pilot area (8 km view).", "ok");
    }

    function startPilotLocationTracking(centerOnFirstFix) {
      if (!navigator.geolocation) {
        setStatus("Geolocation is not available in this browser.", "warn");
        return;
      }
      if (locationWatchId !== null) return;

      let firstFix = true;
      locationWatchId = navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const acc = pos.coords.accuracy;
          updatePilotLocation(lat, lon, acc);
          if (centerOnFirstFix && firstFix) {
            map.setView([lat, lon], Math.max(map.getZoom(), 10));
            firstFix = false;
          }
          setStatus(
            "Pilot location updated: " + lat.toFixed(6) + ", " + lon.toFixed(6) +
            (Number.isFinite(acc) ? (" (±" + Math.round(acc) + "m)") : ""),
            "ok"
          );
        },
        (err) => {
          setStatus("Geolocation error: " + (err.message || "unknown"), "warn");
        },
        {
          enableHighAccuracy: true,
          maximumAge: 10000,
          timeout: 15000
        }
      );
    }

    function filteredCollection() {
      if (!sourceData || !Array.isArray(sourceData.features)) {
        return { type: "FeatureCollection", features: [] };
      }
      const classes = selectedClassSet();
      const types = selectedTypeSet();
      const features = sourceData.features.filter((f) => featurePasses(f, classes, types));
      return { ...sourceData, features };
    }

    function applyFilters(fit = false) {
      const filtered = filteredCollection();
      airspaceLayer.clearLayers();
      airspaceLayer.addData(filtered);

      const count = filtered.features.length;
      setStatus("Showing " + count + " filtered features.", "ok");

      if (fit && airspaceLayer.getLayers().length) {
        map.fitBounds(airspaceLayer.getBounds(), { padding: [20, 20] });
      }
    }

    function pointInRing(lat, lon, ring) {
      let inside = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const xi = ring[i][0];
        const yi = ring[i][1];
        const xj = ring[j][0];
        const yj = ring[j][1];
        const intersects = ((yi > lat) !== (yj > lat)) &&
          (lon < ((xj - xi) * (lat - yi)) / ((yj - yi) || 1e-12) + xi);
        if (intersects) inside = !inside;
      }
      return inside;
    }

    function pointInPolygon(lat, lon, polygonCoords) {
      if (!Array.isArray(polygonCoords) || !polygonCoords.length) return false;
      if (!pointInRing(lat, lon, polygonCoords[0])) return false;
      for (let i = 1; i < polygonCoords.length; i += 1) {
        if (pointInRing(lat, lon, polygonCoords[i])) return false;
      }
      return true;
    }

    function findHits(lat, lon) {
      const data = filteredCollection();
      const hits = [];
      data.features.forEach((feature) => {
        const g = feature.geometry || {};
        if (g.type === "Polygon" && pointInPolygon(lat, lon, g.coordinates)) {
          hits.push(feature);
        }
      });
      return hits;
    }

    async function loadData() {
      try {
        const candidates = [
          "data/airspace/dah_gold_airspace.geojson",
          "/data/airspace/dah_gold_airspace.geojson"
        ];

        let json = null;
        for (const src of candidates) {
          const r = await fetch(src, { cache: "no-store" });
          if (!r.ok) continue;
          const data = await r.json();
          if (data && data.type === "FeatureCollection" && Array.isArray(data.features)) {
            json = data;
            break;
          }
        }

        if (!json) {
          throw new Error("Unable to load dah_gold_airspace.geojson");
        }

        sourceData = json;
        const meta = json.metadata || {};
        const metaEl = document.getElementById("cycleMeta");
        metaEl.textContent = [
          meta.publication_date ? ("Cycle: " + meta.publication_date) : "",
          meta.valid ? ("Valid: " + meta.valid) : "",
          meta.source_url ? ("Source: " + meta.source_url) : ""
        ].filter(Boolean).join(" | ");
        applyFilters(true);
      } catch (err) {
        setStatus("Load failed: " + (err.message || "unknown"), "warn");
      }
    }

    document.querySelectorAll(".class-filter").forEach((el) => el.addEventListener("change", () => applyFilters()));
    document.querySelectorAll(".type-filter").forEach((el) => el.addEventListener("change", () => applyFilters()));

    document.getElementById("classCheckAll").addEventListener("click", () => {
      document.querySelectorAll(".class-filter").forEach((el) => { el.checked = true; });
      applyFilters();
    });

    document.getElementById("classUncheckAll").addEventListener("click", () => {
      document.querySelectorAll(".class-filter").forEach((el) => { el.checked = false; });
      applyFilters();
    });

    document.getElementById("typeCheckAll").addEventListener("click", () => {
      document.querySelectorAll(".type-filter").forEach((el) => { el.checked = true; });
      applyFilters();
    });

    document.getElementById("typeUncheckAll").addEventListener("click", () => {
      document.querySelectorAll(".type-filter").forEach((el) => { el.checked = false; });
      applyFilters();
    });

    document.getElementById("fitBtn").addEventListener("click", () => {
      if (airspaceLayer.getLayers().length) {
        map.fitBounds(airspaceLayer.getBounds(), { padding: [20, 20] });
      }
    });

    document.getElementById("toggleFiltersBtn").addEventListener("click", () => {
      const page = document.querySelector(".page");
      const btn = document.getElementById("toggleFiltersBtn");
      const collapsed = page.classList.toggle("filters-collapsed");
      btn.textContent = collapsed ? "Show Filters" : "Collapse Filters";
      setTimeout(() => map.invalidateSize(), 150);
    });

    document.getElementById("fullscreenMapBtn").addEventListener("click", async () => {
      const btn = document.getElementById("fullscreenMapBtn");
      const main = document.getElementById("mapMain");
      try {
        if (!document.fullscreenElement) {
          await main.requestFullscreen();
          btn.textContent = "Exit Full Screen";
        } else {
          await document.exitFullscreen();
          btn.textContent = "Full Screen Map";
        }
      } catch {
        setStatus("Fullscreen mode is not available in this browser context.", "warn");
      } finally {
        setTimeout(() => map.invalidateSize(), 200);
      }
    });

    document.addEventListener("fullscreenchange", () => {
      const btn = document.getElementById("fullscreenMapBtn");
      btn.textContent = document.fullscreenElement ? "Exit Full Screen" : "Full Screen Map";
      setTimeout(() => map.invalidateSize(), 120);
    });

    document.getElementById("locBtn").addEventListener("click", () => {
      startPilotLocationTracking(true);
    });

    document.getElementById("focusPilotBtn").addEventListener("click", () => {
      focusOnPilotArea();
    });

    document.getElementById("checkBtn").addEventListener("click", () => {
      const lat = Number(document.getElementById("latInput").value.trim());
      const lon = Number(document.getElementById("lonInput").value.trim());
      if (!Number.isFinite(lat) || !Number.isFinite(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) {
        setStatus("Enter valid DD latitude/longitude.", "warn");
        return;
      }

      const hits = findHits(lat, lon);
      if (!hits.length) {
        setStatus("No filtered airspace hit at " + lat.toFixed(6) + ", " + lon.toFixed(6), "ok");
        return;
      }

      const names = hits.slice(0, 4).map((f) => {
        const p = f.properties || {};
        return (p.id || "") + " " + (p.name || "");
      }).join(" | ");
      const more = hits.length > 4 ? " (plus " + (hits.length - 4) + " more)" : "";
      setStatus("Hit " + hits.length + " airspace feature(s): " + names + more, "ok");

      L.circleMarker([lat, lon], {
        radius: 6,
        color: "#101820",
        fillColor: "#1e87ff",
        fillOpacity: 0.9,
        weight: 1.5
      }).addTo(map);
      map.setView([lat, lon], Math.max(map.getZoom(), 9));
    });

    loadData();
    startPilotLocationTracking(false);
  </script>
</body>
</html>
