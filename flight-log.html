<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Log</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <nav class="top-nav">
    <a href="index.html">Home</a> |
    <a href="tools.html" target="_blank" rel="noopener">Tools</a> |
    <a href="flight-log.html" class="active">Flight Log</a> |
    <a href="summary.html">Summary</a>
  </nav>

  <header class="site-header">
  <img src="assets/img/logo.png" alt="Logo" class="site-logo">
  <h1 class="page-title">Flight Log Information</h1>
  </header>

  <!-- Quick Location Tool for Pilot -->
  <div class="location-tool" style="margin-bottom:1.5em;">
    <button type="button" id="getLocation">Get Your Latitude and Longitude</button>
    <p id="output"></p>
  </div>

  <form id="flight-log-form">
    <table class="flight-log-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Pilot Name(s)</th>
          <th>Observer Name(s)</th>
          <th>Start Time</th>
          <th>End Time</th>
          <th>Pilot Location</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>
            <label for="flight-date" class="visually-hidden">Flight Date</label>
            <input type="date" id="flight-date" title="Flight Date" placeholder="YYYY-MM-DD" required>
          </td>
          <td><input type="text"   id="flight-pilot"     placeholder="e.g. J. Smith"     required></td>
          <td><input type="text"   id="flight-observers" placeholder="n/a"></td>
          <td><input type="time"   id="flight-start"     required></td>
          <td><input type="time"   id="flight-end"       required></td>
          <td><input type="text"   id="flight-location"  placeholder="e.g. Field A (Lat,Long)" required></td>
        </tr>
      </tbody>
    </table>
    <button type="submit">Save Flight Log</button>
  </form>

  <script src="assets/js/app.js"></script>
  <script>
  // Helper to convert decimal degrees to DMS string
  function toDMS(deg, isLat) {
    const abs = Math.abs(deg);
    const d = Math.floor(abs);
    const mFloat = (abs - d) * 60;
    const m = Math.floor(mFloat);
    const s = ((mFloat - m) * 60).toFixed(1);
    const dir = isLat
      ? (deg >= 0 ? "N" : "S")
      : (deg >= 0 ? "E" : "W");
    return `${d}°${m}'${s}"${dir}`;
  }

  document.addEventListener('DOMContentLoaded', function() {
    const btn = document.getElementById('getLocation');
    if (!btn) return;
    btn.addEventListener('click', () => {
      const output = document.getElementById('output');
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;
            // Round to 4 decimal places
            const latShort = latitude.toFixed(4);
            const lonShort = longitude.toFixed(4);
            // Convert to DMS
            const latDMS = toDMS(latitude, true);
            const lonDMS = toDMS(longitude, false);
            output.innerHTML =
              `DD: ${latShort}, ${lonShort}<br>` +
              `DMS: ${latDMS}, ${lonDMS}`;
            // Autofill the Pilot Location field
            const locInput = document.getElementById('flight-location');
            if (locInput) {
              locInput.value = `${latShort}, ${lonShort}`;
            }
            // Store in localStorage
            localStorage.setItem('pilotLocationDD', `${latShort}, ${lonShort}`);
            localStorage.setItem('pilotLocationDMS', `${latDMS}, ${lonDMS}`);
          },
          (error) => {
            switch (error.code) {
              case error.PERMISSION_DENIED:
                output.textContent = "User denied the request for Geolocation.";
                break;
              case error.POSITION_UNAVAILABLE:
                output.textContent = "Location information is unavailable.";
                break;
              case error.TIMEOUT:
                output.textContent = "The request to get user location timed out.";
                break;
              default:
                output.textContent = "An unknown error occurred.";
                break;
            }
          }
        );
      } else {
        output.textContent = "Geolocation is not supported by this browser.";
      }
    });
  });
  </script>
</body>
</html>
