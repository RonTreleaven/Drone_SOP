<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 364 374">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="43%" r="57%">
      <stop offset="0%"   stop-color="#4a82c8"/>
      <stop offset="60%"  stop-color="#2c5fa0"/>
      <stop offset="100%" stop-color="#153d74"/>
    </radialGradient>
    <linearGradient id="ribGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4e88d0"/>
      <stop offset="100%" stop-color="#1e4f8a"/>
    </linearGradient>
    <clipPath id="cc">
      <circle cx="182" cy="172" r="158"/>
    </clipPath>
    <pattern id="gp" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0L0 0 0 22" fill="none" stroke="rgba(80,130,210,0.40)" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Badge outer rim -->
  <circle cx="182" cy="172" r="161" fill="#0e2f5e"/>
  <!-- Badge main fill -->
  <circle cx="182" cy="172" r="158" fill="url(#bgGrad)"/>
  <!-- Grid pattern overlay -->
  <rect x="0" y="0" width="364" height="374" fill="url(#gp)" clip-path="url(#cc)"/>
  <!-- Inner accent ring -->
  <circle cx="182" cy="172" r="153" fill="none" stroke="rgba(130,180,255,0.45)" stroke-width="2"/>

  <!-- ===== DRONE SILHOUETTE (white) ===== -->
  <g fill="white">
    <rect x="106" y="146" width="152" height="13" rx="6" transform="rotate( 45 182 152)"/>
    <rect x="106" y="146" width="152" height="13" rx="6" transform="rotate(-45 182 152)"/>

    <circle cx="126" cy="97"  r="27"/>
    <circle cx="238" cy="97"  r="27"/>
    <circle cx="126" cy="207" r="27"/>
    <circle cx="238" cy="207" r="27"/>

    <ellipse cx="126" cy="97"  rx="32" ry="10" transform="rotate(135 126  97)"/>
    <ellipse cx="238" cy="97"  rx="32" ry="10" transform="rotate( 45 238  97)"/>
    <ellipse cx="126" cy="207" rx="32" ry="10" transform="rotate( 45 126 207)"/>
    <ellipse cx="238" cy="207" rx="32" ry="10" transform="rotate(135 238 207)"/>

    <rect x="150" y="130" width="64" height="46" rx="8"/>
    <rect x="164" y="126" width="36" height="7" rx="3"/>
    <ellipse cx="182" cy="175" rx="13" ry="9"/>
  </g>

  <!-- Motor inner hubs -->
  <circle cx="126" cy="97"  r="17" fill="#2052a0"/>
  <circle cx="238" cy="97"  r="17" fill="#2052a0"/>
  <circle cx="126" cy="207" r="17" fill="#2052a0"/>
  <circle cx="238" cy="207" r="17" fill="#2052a0"/>

  <!-- ===== RIBBON BANNER ===== -->
  <path d="M 68,292  L 30,280  L 20,316  L 30,352  L 68,340 Z" fill="#0e2f5e"/>
  <path d="M 296,292 L 334,280 L 344,316 L 334,352 L 296,340 Z" fill="#0e2f5e"/>
  <path d="M 72,291 L 292,291 L 312,316 L 292,342 L 72,342 L 52,316 Z" fill="url(#ribGrad)"/>
  <rect x="74" y="291" width="218" height="8" rx="3" fill="rgba(160,200,255,0.20)"/>
  <rect x="74" y="335" width="218" height="7" rx="2" fill="rgba(0,0,0,0.13)"/>

  <text
    x="182" y="323"
    font-family="'Arial Black', 'Arial Bold', Arial, Helvetica, sans-serif"
    font-size="27" font-weight="900"
    fill="white" text-anchor="middle"
    letter-spacing="1.5"
  >Basic</text>
</svg>
