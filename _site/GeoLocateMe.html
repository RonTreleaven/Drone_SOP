<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find my Location</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
    }
    .top-nav {
      background: #2F5496;
      color: #fff;
      padding: 10px 0;
      text-align: center;
      font-size: 1.1em;
    }
    .top-nav a {
      color: #fff;
      text-decoration: none;
      margin: 0 10px;
    }
    .top-nav a.active {
      font-weight: 700;
      text-decoration: underline;
    }
    .top-nav .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.7rem 0.35rem 0.45rem;
      border-radius: 999px;
      border: 1px solid #9ec9e8;
      background: #eaf5ff;
      color: #0b5ea8;
      font-weight: 700;
      font-size: 0.98rem;
      text-decoration: none;
      vertical-align: middle;
    }
    .top-nav .back-link .back-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.6rem;
      height: 1.6rem;
      border-radius: 999px;
      background: #0b5ea8;
      color: #ffffff;
      font-size: 1rem;
      line-height: 1;
    }
    .top-nav .back-link:hover {
      text-decoration: none;
      background: #d8ecff;
      border-color: #7db2db;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      max-width: 400px;
      margin: 40px auto;
      padding: 28px 32px 24px 32px;
    }
    h1 {
      text-align: center;
      color: #2F5496;
      margin-bottom: 18px;
    }
    .geo-btn {
      display: block;
      width: 100%;
      background: #2F5496;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 12px;
      font-size: 1.1em;
      cursor: pointer;
      margin-bottom: 18px;
      transition: background 0.2s;
    }
    .geo-btn:hover {
      background: #b30000;
    }
    #demo {
      background: #eaf1fb;
      border-left: 4px solid #2F5496;
      padding: 12px;
      border-radius: 6px;
      margin-top: 10px;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <nav class="top-nav">
    <a href="#" class="back-link" onclick="goBack(event)"><span class="back-icon" aria-hidden="true">&#8592;</span>BACK</a> |
    <a href="index.html">Home</a> |
    <a href="Sections.html">SOP Sections</a> |
    <a href="tools.html" class="active">Tools</a> |
    <a href="flight-log.html">Flight Log</a> |
    <a href="summary.html">Summary</a> |
    <a href="emergencies.html">Emergency Procedures</a>
  </nav>
  <div class="card">
    <h1>Fetch My GPS Location</h1>
    <p>Returns your DD and DMS coordinates.</p>
    <button class="geo-btn" onclick="getLocation()">Fetch GPS Location</button>
    <div id="demo"></div>
  </div>

  <script>
  const x = document.getElementById("demo");

  function getLocation() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(success, error);
    } else { 
      x.innerHTML = "Geolocation is not supported by this browser.";
    }
  }

  function toDMS(deg, isLat) {
    const absolute = Math.abs(deg);
    const degrees = Math.floor(absolute);
    const minutesNotTruncated = (absolute - degrees) * 60;
    const minutes = Math.floor(minutesNotTruncated);
    const seconds = ((minutesNotTruncated - minutes) * 60).toFixed(2);
    const direction = deg >= 0
      ? (isLat ? "N" : "E")
      : (isLat ? "S" : "W");
    return `${degrees}°${minutes}'${seconds}"${direction}`;
  }

  function success(position) {
    const lat = position.coords.latitude.toFixed(6);
    const lon = position.coords.longitude.toFixed(6);
    const latDMS = toDMS(position.coords.latitude, true);
    const lonDMS = toDMS(position.coords.longitude, false);
    const mapsLink = `https://www.google.com/maps?q=${lat},${lon}`;
    x.innerHTML = `<strong>Lat/Lon:</strong> ${lat}, ${lon}<br>
      <strong>Lat:</strong> ${lat}<br>
      <strong>Lon:</strong> ${lon}<br>
      <strong>Lat/Lon (DMS):</strong> ${latDMS}, ${lonDMS}<br>
      <a href="${mapsLink}" target="_blank">View on Google Maps</a>`;
    // Save to localStorage for use on other pages
    localStorage.setItem('pilotLocationDD', `${lat}, ${lon}`);
    localStorage.setItem('pilotLocationDMS', `${latDMS}, ${lonDMS}`);
  }

  function error(error) {
    switch(error.code) {
      case error.PERMISSION_DENIED:
        x.innerHTML = "User denied the request for Geolocation."
        break;
      case error.POSITION_UNAVAILABLE:
        x.innerHTML = "Location information is unavailable."
        break;
      case error.TIMEOUT:
        x.innerHTML = "The request to get user location timed out."
        break;
      case error.UNKNOWN_ERROR:
        x.innerHTML = "An unknown error occurred."
        break;
    }
  }

  function goBack(event) {
    event.preventDefault();
    if (window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = "tools.html"; // fallback page
    }
  }
  </script>
</body>
</html>
