<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flight Summary</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <nav class="top-nav">
    <a href="#" onclick="goBack(event)">&larr; Back</a> |
    <a href="index.html">Home</a> |
    <a href="tools.html" target="_blank" rel="noopener">Tools</a> |
    <a href="flight-log.html">Flight Log</a> |
    <a href="summary.html" class="active">Summary</a> |
    <a href="emerge3.html">Emergency Procedures</a>
  </nav>
  <script>
    function goBack(event) {
      event.preventDefault();
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "tools.html"; // fallback page
      }
    }
  </script>

  <header class="site-header">
  <img src="assets/img/logo.png" alt="Logo" class="site-logo">
  <h1 class="page-title">Flight Summary</h1>
  </header>
  <p>Review all your selected completed checklists below.</p>

  <div id="summary-container"></div>
<!--   <form id="flight-log-form">
    <table class="flight-log-table">   
    </table>
  </form> -->
  <div id="pilot-location-summary"></div>

  <!-- Export & navigation controls -->
  <button id="return-home">Return Home</button>
  <button id="export-csv">Download CSV</button>
  <button id="export-pdf">Download PDF</button>
  <button id="clear-data">Clear Previous Inputs Data</button>

  <script src="assets/js/app.js"></script>
  <script>
document.addEventListener('DOMContentLoaded', function() {
  // Show pilot location summary
  const dd = localStorage.getItem('pilotLocationDD');
  const dms = localStorage.getItem('pilotLocationDMS');
  const locationDiv = document.getElementById('pilot-location-summary');
  if (locationDiv && dd && dms) {
    locationDiv.innerHTML =
      `<strong>Pilot Location:</strong><br>DD: ${dd}<br>DMS: ${dms}`;
  } else if (locationDiv) {
    locationDiv.innerHTML = "<em>Pilot location not recorded in this session.</em>";
  }

  // Load SOP progress from localStorage
  const sopProgress = JSON.parse(localStorage.getItem('droneSOPProgress') || '{}');
  const summaryContainer = document.getElementById('summary-container');
  summaryContainer.innerHTML = '';

  // Fetch sections.json for friendly titles
  fetch('data/sections.json')
    .then(res => res.json())
    .then(sections => {
      if (sopProgress.selectedSOPs && sopProgress.progress) {
        sopProgress.selectedSOPs.forEach(sopId => {
          const sop = sopProgress.progress[sopId];
          const sec = sections.find(s => s.id === sopId);
          const title = sec ? sec.title : sopId.replace(/_/g, ' ');
          const div = document.createElement('div');
          div.className = 'sop-summary';

          div.innerHTML = `<strong>${title}</strong> — Status: <em>${sop.status.replace('-', ' ')}</em>`;

          // Add a button to revisit the SOP/Section
          const btn = document.createElement('button');
          btn.textContent = sop.status === "completed" ? "Review/Edit" : "Continue";
          btn.onclick = function() {
            // Redirect to the SOP page (adjust path as needed)
            window.location.href = `sections/${sopId}.html`;
          };
          div.appendChild(btn);

          if (sop.status === "completed") div.style.background = "#e0ffe0";

          summaryContainer.appendChild(div);
        });
      } else {
        summaryContainer.innerHTML = "<em>No SOP progress found for this session.</em>";
      }
    });

  // Clear data button logic
  document.getElementById('clear-data').addEventListener('click', function() {
    if (confirm('Are you sure you want to wipe/clear all data? This cannot be undone.')) {
      // Remove all relevant localStorage keys
      localStorage.removeItem('pilotLocationDD');
      localStorage.removeItem('pilotLocationDMS');
      localStorage.removeItem('flightDate');
      localStorage.removeItem('flightPilot');
      localStorage.removeItem('flightObservers');
      localStorage.removeItem('flightStart');
      localStorage.removeItem('flightEnd');
      localStorage.removeItem('flightLocation');
      localStorage.removeItem('selectedSections');
      localStorage.removeItem('flightLog');
      localStorage.removeItem('droneSOPProgress');
      // Remove any section responses
      Object.keys(localStorage).forEach(key => {
        if (key.startsWith('responses_')) localStorage.removeItem(key);
      });
      location.reload();
    }
  });
});
  </script>
  
</body>
</html>
