<!DOCTYPE html>
<html>
<body>
<h1>HTML Geolocation</h1>
<p>Click the button to get your coordinates.</p>

<button onclick="getLocation()">Get GPS Location</button>

<p id="demo"></p>

<script>
const x = document.getElementById("demo");

function getLocation() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(success, error);
  } else { 
    x.innerHTML = "Geolocation is not supported by this browser.";
  }
}

function toDMS(deg, isLat) {
  const absolute = Math.abs(deg);
  const degrees = Math.floor(absolute);
  const minutesNotTruncated = (absolute - degrees) * 60;
  const minutes = Math.floor(minutesNotTruncated);
  const seconds = ((minutesNotTruncated - minutes) * 60).toFixed(2);
  const direction = deg >= 0
    ? (isLat ? "N" : "E")
    : (isLat ? "S" : "W");
  return `${degrees}°${minutes}'${seconds}"${direction}`;
}

function success(position) {
  const lat = position.coords.latitude.toFixed(6);
  const lon = position.coords.longitude.toFixed(6);
  const latDMS = toDMS(position.coords.latitude, true);
  const lonDMS = toDMS(position.coords.longitude, false);
  const mapsLink = `https://www.google.com/maps?q=${lat},${lon}`;
  x.innerHTML = `Lat/Lon: ${lat}, ${lon}<br>Lat: ${lat}<br>Lon: ${lon}<br>Lat/Lon (DMS): ${latDMS}, ${lonDMS}<br><a href="${mapsLink}" target="_blank">View on Google Maps</a>`;
}

function error(error) {
  switch(error.code) {
    case error.PERMISSION_DENIED:
      x.innerHTML = "User denied the request for Geolocation."
      break;
    case error.POSITION_UNAVAILABLE:
      x.innerHTML = "Location information is unavailable."
      break;
    case error.TIMEOUT:
      x.innerHTML = "The request to get user location timed out."
      break;
    case error.UNKNOWN_ERROR:
      x.innerHTML = "An unknown error occurred."
      break;
  }
}
</script>

</body>
</html>
