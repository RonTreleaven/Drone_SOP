<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drone Jobs Review</title>
  <link rel="stylesheet" href="assets/css/site-nav.css" />
  <script src="assets/js/site-nav.js" defer></script>
  <style>
    :root {
      --bg: #f3f7fb;
      --ink: #12243f;
      --muted: #4a5a72;
      --card: #ffffff;
      --line: #d6e0ed;
      --accent: #0f766e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at top right, #d8f6ef, var(--bg));
    }
    .wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 14px 12px 24px;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 8px 24px rgba(9, 30, 66, 0.08);
      margin-bottom: 10px;
    }
    .top-nav {
      margin-bottom: 10px;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 24px;
    }
    .refresh-stamp {
      margin-left: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
    }
    .muted {
      color: var(--muted);
      font-size: 13px;
    }
    details.filter-drawer {
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #f9fcff;
      padding: 8px;
    }
    details.filter-drawer > summary {
      cursor: pointer;
      font-weight: 700;
      color: #1f3557;
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid #cfdcee;
      border-radius: 10px;
      background: linear-gradient(135deg, #eef5ff, #e7f4ff);
      min-height: 44px;
    }
    details.filter-drawer > summary::after {
      content: "Tap to open";
      font-size: 11px;
      color: #4c6483;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    details.filter-drawer[open] > summary::after {
      content: "Tap to close";
    }
    details.filter-drawer[open] > summary {
      margin-bottom: 8px;
    }
    details.filter-drawer > summary::-webkit-details-marker { display: none; }
    .filters {
      margin-top: 8px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .filter-item {
      min-width: 0;
    }
    .filter-item.search {
      grid-column: 1 / -1;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }
    input, select, button {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      font: inherit;
      background: #fff;
      color: var(--ink);
    }
    .actions {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      position: sticky;
      bottom: 0;
      z-index: 3;
      padding-top: 8px;
      background: linear-gradient(180deg, rgba(249, 252, 255, 0), rgba(249, 252, 255, 0.96) 24%, rgba(249, 252, 255, 1) 100%);
    }
    button {
      cursor: pointer;
      border: none;
      background: linear-gradient(135deg, #0f766e, #0284c7);
      color: #fff;
      font-weight: 700;
      text-align: center;
      font-size: 0.84rem;
      min-height: 42px;
      white-space: nowrap;
      padding: 8px 6px;
    }
    button.secondary {
      background: #607891;
    }
    button.export {
      background: #1f4b77;
    }
    .status-row {
      display: grid;
      grid-template-columns: 1fr;
      margin-top: 10px;
    }
    .status-pill {
      border: 1px solid #2f4c69;
      background: linear-gradient(135deg, #112b49 0%, #133e67 52%, #0f5f7e 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 10px 20px rgba(10, 27, 45, 0.26);
      border-radius: 12px;
      padding: 8px;
    }
    .status-metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .status-metric {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      border: 1px solid rgba(166, 200, 232, 0.3);
      border-radius: 9px;
      background: rgba(10, 22, 39, 0.36);
      padding: 5px 7px;
    }
    .status-pill .k {
      display: inline-block;
      color: #bad0e5;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      line-height: 1;
      margin-bottom: 4px;
      font-weight: 800;
    }
    .status-pill .v {
      color: #ffe57a;
      font-size: 1rem;
      line-height: 1.2;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.18);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      word-break: break-word;
      text-align: center;
    }
    .status-sep {
      display: none;
    }
    .status-sources {
      margin-top: 8px;
      border-top: 1px solid rgba(178, 211, 239, 0.28);
      padding-top: 6px;
      color: #d6e8f8;
      font-size: 0.73rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-sources .src-label {
      color: #d6e8f8;
      margin-right: 4px;
    }
    .status-sources .src-item {
      color: #98d5ff;
      margin-right: 10px;
    }
    .status-sources .src-count {
      display: inline-block;
      min-width: 1.35em;
      padding: 1px 5px;
      margin-left: 3px;
      border-radius: 4px;
      background: #000000;
      color: #ffd24a;
      font-size: 0.72rem;
      font-weight: 800;
      line-height: 1.2;
      text-align: center;
      font-variant-numeric: tabular-nums;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
    }
    .status-toggle-row {
      margin-top: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .status-toggle-btn {
      width: auto;
      min-width: 138px;
      max-width: 100%;
      min-height: 34px;
      padding: 6px 12px;
      border: 1px solid rgba(166, 200, 232, 0.32);
      border-radius: 8px;
      background: rgba(10, 22, 39, 0.45);
      color: #d9ecff;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1;
      white-space: nowrap;
    }
    .status-toggle-btn:hover {
      background: rgba(20, 43, 69, 0.62);
    }
    .status-toggle-btn.export-all {
      border-color: rgba(255, 210, 74, 0.45);
      color: #ffe59b;
      background: rgba(39, 28, 9, 0.52);
    }
    .status-toggle-btn.export-all:hover {
      background: rgba(60, 42, 13, 0.68);
    }
    #statusError {
      margin-top: 8px;
    }
    .list-wrap {
      max-height: calc(100vh - 240px);
      overflow: auto;
      padding-right: 4px;
    }
    .job-list {
      display: grid;
      gap: 10px;
      max-width: 760px;
      margin: 0 auto;
    }
    .job {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
    }
    .job-title {
      margin: 0 0 8px;
      font-size: clamp(1rem, 1.8vw, 1.1rem);
      color: #17325a;
    }
    .job-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 8px;
      margin-bottom: 8px;
    }
    .job-head .job-title {
      margin: 0;
      flex: 1;
      min-width: 0;
    }
    .job-title-toggle {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: inherit;
      padding: 0;
      font: inherit;
      line-height: 1.2;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
    }
    .job-title-toggle::before {
      content: "▾";
      color: #3e5978;
      font-size: 0.95rem;
      flex: 0 0 auto;
      transition: transform 0.15s ease;
    }
    .job.collapsed .job-title-toggle::before {
      transform: rotate(-90deg);
    }
    .job-title-text {
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .job-body {
      display: block;
    }
    .job.collapsed .job-body {
      display: none;
    }
    .job-select {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
      justify-self: end;
      align-self: start;
    }
    .job-select input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #0f766e;
    }
    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
      margin-bottom: 8px;
    }
    .field {
      border: 1px solid #e4ebf4;
      border-radius: 8px;
      padding: 7px;
      background: #fcfeff;
    }
    .field .k {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.02em;
      margin-bottom: 2px;
      font-weight: 700;
    }
    .field .v {
      font-size: 14px;
      font-weight: 600;
      word-break: break-word;
    }
    .summary {
      border: 1px solid #e4ebf4;
      border-radius: 8px;
      padding: 9px;
      font-size: 14px;
      line-height: 1.45;
      background: #fafdff;
      margin-bottom: 8px;
      max-height: 158px;
      overflow: auto;
    }
    .summary .fr-segment {
      color: #355c86;
      font-style: italic;
    }
    .link-line a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
      word-break: break-all;
    }
    .link-line a:hover { text-decoration: underline; }
    @media (max-width: 980px) {
      .status-metrics {
        grid-template-columns: 1fr;
      }
      .field-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .actions {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .list-wrap { max-height: none; }
      .summary { max-height: 176px; }
      .status-sources {
        font-size: 0.72rem;
      }
    }
    @media (max-width: 640px) {
      .filters {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .actions {
        gap: 6px;
      }
      button {
        font-size: 0.78rem;
        min-height: 44px;
      }
      .field-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .job-title {
        font-size: 0.98rem;
      }
      .job-select {
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="top-nav shared-site-nav" data-nav-variant="utility" data-back-fallback="tools.html"></nav>

    <section class="panel">
      <h1>Drone Jobs Review <span id="refreshStamp" class="refresh-stamp"></span></h1>
      <div class="muted">Focus view of unique jobs from data/jobs.json. Open Filters panel to refine the list.</div>

      <details class="filter-drawer" id="filterDrawer">
        <summary>Filters</summary>
        <div class="filters">
          <div class="filter-item search">
            <label for="q">Search</label>
            <input id="q" type="text" placeholder="Company, title, location, category, summary" title="Search filter" />
          </div>
          <div class="filter-item">
            <label for="source">Source</label>
            <select id="source" title="Source filter"></select>
          </div>
          <div class="filter-item">
            <label for="category">Category</label>
            <select id="category" title="Category filter"></select>
          </div>
          <div class="filter-item">
            <label for="minConf">Min confidence</label>
            <input id="minConf" type="number" min="0" max="1" step="0.05" value="0.50" placeholder="0.50" title="Minimum confidence" list="minConfHints" />
            <datalist id="minConfHints">
              <option value="0.25"></option>
              <option value="0.35"></option>
              <option value="0.45"></option>
              <option value="0.50"></option>
              <option value="0.60"></option>
              <option value="0.70"></option>
              <option value="0.75"></option>
              <option value="0.85"></option>
              <option value="0.95"></option>
              <option value="1.00"></option>
            </datalist>
          </div>
          <div class="filter-item">
            <label for="canadaOnly">Canada only</label>
            <select id="canadaOnly" title="Canada-only filter">
              <option value="yes" selected>Yes</option>
              <option value="no">No</option>
              <option value="intl">International</option>
            </select>
          </div>
        </div>
        <div class="actions">
          <button id="applyBtn" type="button">Apply Filters</button>
          <button id="resetBtn" class="secondary" type="button">Reset Filters</button>
          <button id="exportBtn" class="export" type="button" title="Export checked jobs to CSV">Export Selected (0)</button>
        </div>
      </details>

      <div class="status-row" id="statusRow" aria-live="polite">
        <div class="status-pill">
          <div class="status-metrics">
            <div class="status-metric">
              <span class="k">Showing</span>
              <span class="v" id="statusCount">0 of 0 jobs</span>
            </div>
            <span class="status-sep" aria-hidden="true">|</span>
            <div class="status-metric">
              <span class="k">Last Run</span>
              <span class="v" id="statusRun">-</span>
            </div>
          </div>
          <div class="status-toggle-row">
            <button id="toggleAllBtn" class="status-toggle-btn" type="button">Collapse All</button>
            <button id="exportSelectedTopBtn" class="status-toggle-btn export-all" type="button">Export Selected (0)</button>
            <button id="clearExportsBtn" class="status-toggle-btn" type="button">Clear Exports</button>
          </div>
          <div class="status-sources" id="statusSources">Sources: -</div>
        </div>
      </div>
      <div id="statusError" class="muted"></div>
    </section>

    <div class="list-wrap">
      <section id="jobList" class="job-list"></section>
    </div>
  </div>

  <script>
    let jobs = [];
    let lastRunLabel = "-";
    const selectedJobKeys = new Set();
    const collapsedJobKeys = new Set();
    const MIN_CONF_PRESETS = [0.25, 0.35, 0.45, 0.5, 0.6, 0.7, 0.75, 0.85, 0.95, 1.0];

    function normalizeText(value) {
      if (value === null || value === undefined) return "";
      return String(value)
        .replace(/\u2013|\u2014/g, "-")
        .normalize("NFKD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();
    }

    function normalizeDate(value) {
      if (!value) return "";
      const s = String(value).trim();
      const mmdd = /^(\d{2})\/(\d{2})\/(\d{4})$/;
      if (mmdd.test(s)) return s;
      const d = new Date(s);
      if (Number.isNaN(d.getTime())) return "";
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      const yy = d.getFullYear();
      return `${mm}/${dd}/${yy}`;
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatDescriptionHtml(text) {
      const source = String(text || "");
      const headingLabels = [
        "Job Title",
        "Job Type",
        "Work Location",
        "Location",
        "Benefits",
        "Qualifications",
        "Key Responsibilities",
        "Responsibilities",
        "Requirements",
        "Required skills",
        "Pay Rate",
        "About the Role",
      ];
      const frenchIndicators = [
        "travail",
        "temps plein",
        "temps partiel",
        "competences",
        "responsabilites",
        "exigences",
        "salaire",
        "francais",
        "anglais",
        "poste",
        "pour",
        "avec",
      ];

      function isFrenchLikeSegment(segment) {
        const s = String(segment || "").toLowerCase();
        if (/[àâäéèêëîïôöùûüçœ]/i.test(s)) {
          return true;
        }
        const normalized = s
          .normalize("NFKD")
          .replace(/[\u0300-\u036f]/g, "");
        let score = 0;
        frenchIndicators.forEach((token) => {
          if (normalized.includes(token)) score += 1;
        });
        return score >= 2 && normalized.length >= 30;
      }

      const chunks = source.match(/[^.!?\n]+[.!?]?|\n+/g) || [source];
      const escaped = chunks.map((chunk) => {
        const plain = chunk.trim();
        const safe = escapeHtml(chunk);
        if (!plain) return safe;
        return isFrenchLikeSegment(plain)
          ? `<span class="fr-segment">${safe}</span>`
          : safe;
      }).join("");

      const escapedLabels = headingLabels.map(label =>
        label.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")
      );
      const headingPattern = new RegExp(`\\b(${escapedLabels.join("|")}):`, "gi");
      return escaped.replace(headingPattern, "<strong>$1:</strong>");
    }

    function isCanadaLocation(text) {
      const t = (text || "").toLowerCase();
      const provinceCodes = [", on", ", qc", ", bc", ", ab", ", mb", ", sk", ", ns", ", nb", ", nl", ", pe", ", yt", ", nt", ", nu"];
      const provinceNames = [
        "ontario",
        "quebec",
        "british columbia",
        "alberta",
        "manitoba",
        "saskatchewan",
        "nova scotia",
        "new brunswick",
        "newfoundland and labrador",
        "prince edward island",
        "yukon",
        "northwest territories",
        "nunavut",
      ];

      if (t.includes("canada")) return true;
      if (provinceCodes.some(token => t.includes(token))) return true;
      if (provinceNames.some(name => t.includes(name))) return true;

      // Treat trailing ", ca" as country code only when format is city, region, country.
      const commaSegments = t.split(",").map(s => s.trim()).filter(Boolean);
      if (/,\s*ca\s*$/.test(t) && commaSegments.length >= 3) return true;

      return false;
    }

    function optionMarkup(values, allLabel = "All") {
      const options = [`<option value="">${allLabel}</option>`];
      values.forEach(v => {
        options.push(`<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`);
      });
      return options.join("");
    }

    function jobKey(job) {
      if (job && job._jobKey) return job._jobKey;
      const linkKey = String(job && job.link ? job.link : "").trim();
      if (linkKey) return linkKey;
      return `${normalizeText(job && job.title)}|${normalizeText(job && job.company)}|${normalizeText(job && job.location)}`;
    }

    function buildFilters() {
      const sources = [...new Set(jobs.map(j => normalizeText(j.source)).filter(Boolean))].sort();
      const categories = [...new Set(jobs.map(j => normalizeText(j.category)).filter(Boolean))].sort();
      document.getElementById("source").innerHTML = optionMarkup(sources);
      document.getElementById("category").innerHTML = optionMarkup(categories);
    }

    function currentFilters() {
      return {
        q: document.getElementById("q").value.trim().toLowerCase(),
        source: document.getElementById("source").value,
        category: document.getElementById("category").value,
        minConf: parseFloat(document.getElementById("minConf").value || "0"),
        canadaOnly: document.getElementById("canadaOnly").value,
      };
    }

    function formatConfidence(value) {
      const safe = Number.isFinite(value) ? value : 0;
      const clamped = Math.min(1, Math.max(0, safe));
      return clamped.toFixed(2);
    }

    function snapConfidence(value) {
      const numeric = Number(value);
      if (!Number.isFinite(numeric)) return MIN_CONF_PRESETS[0];
      return Math.min(1, Math.max(0, numeric));
    }

    function findPresetIndex(current, direction) {
      const tolerance = 0.0001;
      const exactIndex = MIN_CONF_PRESETS.findIndex(v => Math.abs(v - current) < tolerance);
      if (exactIndex !== -1) {
        return Math.min(MIN_CONF_PRESETS.length - 1, Math.max(0, exactIndex + direction));
      }

      if (direction > 0) {
        const nextIndex = MIN_CONF_PRESETS.findIndex(v => v > current);
        return nextIndex === -1 ? MIN_CONF_PRESETS.length - 1 : nextIndex;
      }

      for (let i = MIN_CONF_PRESETS.length - 1; i >= 0; i -= 1) {
        if (MIN_CONF_PRESETS[i] < current) return i;
      }
      return 0;
    }

    function setupMinConfidenceHelper() {
      const minConfInput = document.getElementById("minConf");
      if (!minConfInput) return;

      minConfInput.addEventListener("keydown", (event) => {
        if (event.key !== "ArrowUp" && event.key !== "ArrowDown") return;
        event.preventDefault();
        const direction = event.key === "ArrowUp" ? 1 : -1;
        const current = snapConfidence(minConfInput.value);
        const nextIndex = findPresetIndex(current, direction);
        minConfInput.value = formatConfidence(MIN_CONF_PRESETS[nextIndex]);
        render();
      });

      minConfInput.addEventListener("change", () => {
        minConfInput.value = formatConfidence(snapConfidence(minConfInput.value));
        render();
      });
    }

    function filterJobs() {
      const f = currentFilters();
      return jobs.filter(job => {
        const title = normalizeText(job.title);
        const company = normalizeText(job.company);
        const location = normalizeText(job.location);
        const description = normalizeText(job.description);
        const summary = normalizeText(job.summary);
        const source = normalizeText(job.source);
        const category = normalizeText(job.category);
        const confidence = Number(job.confidence || 0);
        const inCanada = isCanadaLocation(location);

        if (f.source && source !== f.source) return false;
        if (f.category && category !== f.category) return false;
        if (confidence < f.minConf) return false;
        if (f.canadaOnly === "yes" && !inCanada) return false;
        if (f.canadaOnly === "intl" && inCanada) return false;

        if (f.q) {
          const hay = `${company} ${title} ${location} ${source} ${category} ${description} ${summary}`.toLowerCase();
          if (!hay.includes(f.q)) return false;
        }
        return true;
      });
    }

    function fieldRow(label, value) {
      return `<div class="field"><div class="k">${label}</div><div class="v">${escapeHtml(value || "N/A")}</div></div>`;
    }

    function rowHtml(job) {
      const company = normalizeText(job.company);
      const title = normalizeText(job.title);
      const location = normalizeText(job.location);
      const source = normalizeText(job.source);
      const posted = normalizeDate(job.date_posted);
      const expires = normalizeDate(job.date_expires);
      const category = normalizeText(job.category);
      const description = normalizeText(job.description);
      const summary = normalizeText(job.summary);
      const descriptionText = description || summary;
      const url = String(job.link || "").trim();
      const key = jobKey(job);
      const checked = selectedJobKeys.has(key) ? " checked" : "";
      const isCollapsed = collapsedJobKeys.has(key);
      const cardClass = isCollapsed ? "job collapsed" : "job";
      const expanded = isCollapsed ? "false" : "true";

      return `
      <article class="${cardClass}">
        <div class="job-head">
          <h2 class="job-title">
            <button class="job-title-toggle" type="button" data-job-key="${escapeHtml(key)}" aria-expanded="${expanded}" title="Collapse or expand this job card">
              <span class="job-title-text">${escapeHtml(title || "Untitled Job")}</span>
            </button>
          </h2>
          <label class="job-select">
            <input type="checkbox" class="job-select-input" data-job-key="${escapeHtml(key)}"${checked} />
            Export
          </label>
        </div>
        <div class="job-body">
        <div class="field-grid">
          ${fieldRow("Company", company)}
          ${fieldRow("Location", location)}
          ${fieldRow("Source", source)}
          ${fieldRow("Category", category)}
          ${fieldRow("Date Posted", posted)}
          ${fieldRow("Expired", expires)}
        </div>
        <div class="summary">${formatDescriptionHtml(descriptionText || "No description available")}</div>
        <div class="link-line"><a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">View Source Job URL</a></div>
        </div>
      </article>`;
    }

    function csvEscape(value) {
      const text = String(value === null || value === undefined ? "" : value);
      const escaped = text.replace(/"/g, '""');
      return `"${escaped}"`;
    }

    function exportSelectedJobs() {
      const selected = jobs.filter(job => selectedJobKeys.has(jobKey(job)));
      if (!selected.length) {
        document.getElementById("statusError").textContent = "Select at least one job to export.";
        return;
      }

      const headers = [
        "title",
        "company",
        "location",
        "source",
        "category",
        "type",
        "date_posted",
        "date_expires",
        "query_family",
        "matched_query",
        "confidence",
        "link",
        "description",
        "summary",
      ];

      const lines = [headers.map(csvEscape).join(",")];
      selected.forEach(job => {
        lines.push(headers.map(field => csvEscape(job[field] || "")).join(","));
      });

      const blob = new Blob([lines.join("\r\n")], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const datePart = new Date().toISOString().slice(0, 10);
      const download = document.createElement("a");
      download.href = url;
      download.download = `drone_jobs_selected_${datePart}.csv`;
      document.body.appendChild(download);
      download.click();
      download.remove();
      URL.revokeObjectURL(url);

      document.getElementById("statusError").textContent = `Exported ${selected.length} selected jobs to CSV.`;
    }

    function updateExportButton() {
      const selectedCount = jobs.filter(job => selectedJobKeys.has(jobKey(job))).length;
      const btn = document.getElementById("exportBtn");
      const topBtn = document.getElementById("exportSelectedTopBtn");
      btn.textContent = `Export Selected (${selectedCount})`;
      btn.disabled = selectedCount === 0;
      btn.classList.toggle("secondary", selectedCount === 0);
      if (topBtn) {
        topBtn.textContent = `Export Selected (${selectedCount})`;
        topBtn.disabled = selectedCount === 0;
      }
    }

    function formatSourceTally(list) {
      const counts = new Map();
      list.forEach((job) => {
        const src = normalizeText(job.source || "unknown").toLowerCase() || "unknown";
        counts.set(src, (counts.get(src) || 0) + 1);
      });

      if (!counts.size) {
        return '<span class="src-label">Sources:</span><span class="src-item">none</span>';
      }

      const compact = [...counts.entries()]
        .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
        .map(([name, count]) => `<span class="src-item">${escapeHtml(name)}<span class="src-count">${count}</span></span>`)
        .join("");
      return `<span class="src-label">Sources:</span>${compact}`;
    }

    function updateToggleAllButton(filtered) {
      const btn = document.getElementById("toggleAllBtn");
      if (!btn) return;

      if (!filtered.length) {
        btn.textContent = "Collapse All";
        btn.disabled = true;
        return;
      }

      const allCollapsed = filtered.every(job => collapsedJobKeys.has(jobKey(job)));
      btn.textContent = allCollapsed ? "Expand All" : "Collapse All";
      btn.disabled = false;
    }

    function toggleAllFilteredCards() {
      const filtered = filterJobs();
      if (!filtered.length) return;

      const allCollapsed = filtered.every(job => collapsedJobKeys.has(jobKey(job)));
      filtered.forEach((job) => {
        const key = jobKey(job);
        if (allCollapsed) collapsedJobKeys.delete(key);
        else collapsedJobKeys.add(key);
      });

      render();
    }

    function clearAllExports() {
      selectedJobKeys.clear();
      document.getElementById("statusError").textContent = "Cleared all export selections.";
      render();
    }

    function render() {
      const filtered = filterJobs();
      document.getElementById("statusCount").textContent = `${filtered.length} of ${jobs.length} jobs`;
      document.getElementById("statusRun").textContent = lastRunLabel;
      document.getElementById("statusSources").innerHTML = formatSourceTally(filtered);
      updateToggleAllButton(filtered);
      document.getElementById("jobList").innerHTML = filtered.map(rowHtml).join("");
      updateExportButton();
    }

    function formatRefreshStamp(dateValue) {
      const d = new Date(dateValue);
      if (Number.isNaN(d.getTime())) return "";

      const localDateLabel = d.toLocaleDateString("en-US", {
        month: "long",
        day: "numeric",
        year: "numeric",
      });

      const startOfToday = new Date();
      startOfToday.setHours(0, 0, 0, 0);
      const startOfRefreshDay = new Date(d);
      startOfRefreshDay.setHours(0, 0, 0, 0);

      const daysSince = Math.max(0, Math.floor((startOfToday - startOfRefreshDay) / 86400000));
      const plural = daysSince === 1 ? "day" : "days";
      return `${localDateLabel} (${daysSince} ${plural})`;
    }

    function setRefreshStamp(lastModified) {
      const stampEl = document.getElementById("refreshStamp");
      const label = formatRefreshStamp(lastModified);
      lastRunLabel = label || "Unknown";
      if (stampEl) {
        stampEl.textContent = label ? `- ${label}` : "";
      }
    }

    async function init() {
      try {
        const res = await fetch("data/jobs.json", { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        setRefreshStamp(res.headers.get("last-modified"));
        jobs = await res.json();
      } catch (err) {
        document.getElementById("statusError").textContent = `Failed to load data/jobs.json: ${err.message}`;
        return;
      }

      jobs = jobs.map(j => ({
        ...j,
        _jobKey: jobKey(j),
        company: normalizeText(j.company),
        title: normalizeText(j.title),
        location: normalizeText(j.location),
        source: normalizeText(j.source),
        category: normalizeText(j.category),
        date_posted: normalizeDate(j.date_posted),
        date_expires: normalizeDate(j.date_expires),
        description: normalizeText(j.description),
        summary: normalizeText(j.summary),
      }));

      buildFilters();
      setupMinConfidenceHelper();
      render();

      document.getElementById("applyBtn").addEventListener("click", render);
      document.getElementById("q").addEventListener("input", render);
      document.getElementById("source").addEventListener("change", render);
      document.getElementById("category").addEventListener("change", render);
      document.getElementById("minConf").addEventListener("input", render);
      document.getElementById("canadaOnly").addEventListener("change", render);
      document.getElementById("toggleAllBtn").addEventListener("click", toggleAllFilteredCards);
      document.getElementById("exportSelectedTopBtn").addEventListener("click", exportSelectedJobs);
      document.getElementById("clearExportsBtn").addEventListener("click", clearAllExports);
      document.getElementById("exportBtn").addEventListener("click", exportSelectedJobs);
      document.getElementById("jobList").addEventListener("change", (event) => {
        const input = event.target.closest(".job-select-input");
        if (!input) return;
        const key = input.getAttribute("data-job-key") || "";
        if (!key) return;
        if (input.checked) selectedJobKeys.add(key);
        else selectedJobKeys.delete(key);
        updateExportButton();
      });
      document.getElementById("jobList").addEventListener("click", (event) => {
        const btn = event.target.closest(".job-title-toggle");
        if (!btn) return;
        const key = btn.getAttribute("data-job-key") || "";
        if (!key) return;
        if (collapsedJobKeys.has(key)) collapsedJobKeys.delete(key);
        else collapsedJobKeys.add(key);
        render();
      });
      document.getElementById("q").addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          render();
        }
      });
      document.getElementById("resetBtn").addEventListener("click", () => {
        document.getElementById("q").value = "";
        document.getElementById("source").value = "";
        document.getElementById("category").value = "";
        document.getElementById("minConf").value = "0.50";
        document.getElementById("canadaOnly").value = "yes";
        document.getElementById("statusError").textContent = "";
        render();
      });
    }

    init();
  </script>
</body>
</html>
